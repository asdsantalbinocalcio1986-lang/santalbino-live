function prepareLineupImage(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(blob);
    img.onload = () => {
      try {
        const scale = Math.min(2, 3000 / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const source = document.createElement('canvas');
        source.width = w; source.height = h;
        const sc = source.getContext('2d');
        sc.imageSmoothingEnabled = true; sc.imageSmoothingQuality = 'high';
        sc.drawImage(img, 0, 0, w, h);

        const cropRaw = (x1, x2) => {
          const sx = Math.round(w * x1), sy = Math.round(h * .275);
          const sw = Math.round(w * (x2 - x1)), sh = Math.round(h * .675);
          const c = document.createElement('canvas'); c.width = sw; c.height = sh;
          c.getContext('2d').drawImage(source, sx, sy, sw, sh, 0, 0, sw, sh);
          return c;
        };
        const makeGrayVariant = (input, mode) => {
          const c = document.createElement('canvas'); c.width = input.width; c.height = input.height;
          const cx = c.getContext('2d', { willReadFrequently: true });
          cx.drawImage(input, 0, 0);
          const p = cx.getImageData(0, 0, c.width, c.height), d = p.data;
          for (let i = 0; i < d.length; i += 4) {
            const gray = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
            let value = gray;
            if (mode === 'contrast') value = (gray - 128) * 1.3 + 128;
            else if (mode === 'threshold') value = gray > 175 ? 255 : 0;
            value = Math.max(0, Math.min(255, value));
            d[i] = d[i + 1] = d[i + 2] = value;
          }
          cx.putImageData(p, 0, 0);
          return c;
        };

        // Tre versioni della colonna nomi: scala di grigi naturale,
        // contrasto moderato e soglia netta. Evita di cancellare tratti sottili.
        const nameRaw = cropRaw(.245, .64);
        const nameCrops = [
          makeGrayVariant(nameRaw, 'gray'),
          makeGrayVariant(nameRaw, 'contrast'),
          makeGrayVariant(nameRaw, 'threshold')
        ];
        // Le zone numeriche mantengono la preparazione precedente.
        const cropNumbers = (x1, x2) => {
          const c = cropRaw(x1, x2);
          const cx = c.getContext('2d', { willReadFrequently: true });
          const p = cx.getImageData(0, 0, c.width, c.height), d = p.data;
          for (let i = 0; i < d.length; i += 4) {
            const gray = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
            const value = Math.max(0, Math.min(255, (gray - 145) * 2.0 + 145));
            d[i] = d[i + 1] = d[i + 2] = value;
          }
          cx.putImageData(p, 0, 0);
          return c;
        };
        const numberCrop = cropNumbers(.105, .18);
        const leftMarginNumberCrop = cropNumbers(.075, .205);
        URL.revokeObjectURL(url);
        resolve({ numberCrop, leftMarginNumberCrop, nameCrops });
      } catch (err) {
        URL.revokeObjectURL(url); reject(err);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Immagine non leggibile')); };
    img.src = url;
  });
}

function parseOcrNames(text) {
  const lines = (text || '').split(/\r?\n/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const rows = [];
  for (const raw of lines) {
    let line = raw.replace(/^[|¦•·]+\s*/, '').replace(/^\d{1,2}[.)]?\s+/, '').trim();
    if (!line || /^(cognome\s+(?:e|è)\s+nome|distinta|giocatori|titolari|riserve|panchina)\b/i.test(line)) continue;
    if (/^\(\s*[RP]\s*\)$/i.test(line)) {
      if (rows.length) {
        if (/R/i.test(line)) rows[rows.length - 1].reserve = true;
      }
      continue;
    }
    const reserve = /\(\s*R\s*\)/i.test(line);
    line = line.replace(/\(\s*[RP]\s*\)/gi, '').replace(/[|]+/g, 'I').replace(/^[^A-Za-zÀ-ÖØ-öø-ÿ]+/, '').trim();
    const letters = line.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, '');
    const tokens = line.match(/[A-Za-zÀ-ÖØ-öø-ÿ]+/g) || [];
    const letterRatio = letters.length / Math.max(1, line.length);
    // Le modalità PSM possono scambiare segni T/R e righe della griglia
    // per nominativi: scarta frammenti brevi o con troppo rumore grafico.
    if (letters.length < 6 || !tokens.length || (tokens.length === 1 && letters.length < 8) || letterRatio < .65 || /\d{2,}/.test(line)) continue;
    if (/^(tipo|numero|rilasciato|poggi|lnd)$/i.test(line)) continue;
    rows.push({ name: line, reserve });
  }
  return rows;
}


function selectOcrNameConsensus(passes) {
  if (!passes.length) return [];
  const ranked = [...passes].sort((a,b) =>
    (b.parsed.length * 10 + b.confidence * .02) -
    (a.parsed.length * 10 + a.confidence * .02)
  );
  const anchor = ranked[0].parsed;
  return anchor.map((base, index) => {
    const votes = new Map();
    for (const pass of passes) {
      const candidate = pass.parsed[index];
      if (!candidate) continue;
      const key = candidate.name.normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleUpperCase('it')
        .replace(/[^A-Z]/g, '');
      if (!key) continue;
      const current = votes.get(key) || { name: candidate.name, reserve: false, score: 0, count: 0 };
      current.score += 1 + Math.max(0, Math.min(100, pass.confidence)) / 100;
      current.count += 1;
      current.reserve = current.reserve || candidate.reserve;
      if (candidate.name.length > current.name.length) current.name = candidate.name;
      votes.set(key, current);
    }
    if (!votes.size) return base;
    const winner = [...votes.values()].sort((a,b) => b.score - a.score || b.count - a.count)[0];
    return { name: winner.name, reserve: winner.reserve || base.reserve };
  });
}

function parseOcrNumbers(text) {
  // La colonna è una sequenza verticale: PSM 11 può restituire più numeri
  // sulla stessa riga o separarli da rumore. Estraiamo solo valori 1..24.
  const found = [];
  for (const raw of (text || '').split(/\\r?\n/)) {
    const matches = raw.match(/[0-9]{1,2}|[Il|]{1,2}/g) || [];
    for (const token of matches) {
      const n = Number(token.replace(/[Il|]/g, '1'));
      if (n >= 1 && n <= 24) found.push(String(n));
    }
  }
  return found;
}

let tesseractLoader = null;
let tesseractWorker = null;
let tesseractWorkerPromise = null;
let activeOcrStatus = null;
let ocrQueue = Promise.resolve();
let ocrBusy = false;

async function ensureTesseract() {
  if (window.Tesseract && window.Tesseract.createWorker) return window.Tesseract;
  if (!tesseractLoader) {
    tesseractLoader = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      script.async = true;
      script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Motore OCR non disponibile.'));
      script.onerror = () => reject(new Error('Impossibile caricare il motore OCR. Controlla la connessione e riprova.'));
      document.head.appendChild(script);
    }).catch(error => { tesseractLoader = null; throw error; });
  }
  return tesseractLoader;
}

// Un solo worker per sessione: il download dei dati italiani e l'inizializzazione
// avvengono una volta. Le letture vengono serializzate perché un worker non è
// riutilizzabile in sicurezza da due riconoscimenti contemporanei.
async function ensureOcrWorker() {
  if (tesseractWorker) return tesseractWorker;
  if (!tesseractWorkerPromise) {
    tesseractWorkerPromise = (async () => {
      const Tesseract = await ensureTesseract();
      const logger = message => {
        const stat = activeOcrStatus;
        if (!stat) return;
        if (message.status === 'recognizing text') stat.textContent = 'Riconoscimento testo: ' + Math.round((message.progress || 0) * 100) + '%';
        else if (message.status === 'loading language traineddata' || message.status === 'initializing api') stat.textContent = 'Caricamento del riconoscimento italiano…';
      };
      const worker = await Tesseract.createWorker('ita', 1, { logger });
      tesseractWorker = worker;
      return worker;
    })().catch(error => {
      tesseractWorkerPromise = null;
      throw error;
    });
  }
  return tesseractWorkerPromise;
}

async function resetOcrWorker() {
  const worker = tesseractWorker;
  tesseractWorker = null;
  tesseractWorkerPromise = null;
  if (worker) {
    try { await worker.terminate(); } catch (error) { console.warn('Chiusura worker OCR non riuscita:', error); }
  }
}

async function readLineup(side, stat) {
  if (!photos[side]) { toast('Prima scegli la foto'); return; }
  const matchId = currentMatchId(), photo = photos[side];
  const button = document.querySelector('[data-a="readlist"][data-s="' + side + '"]');
  if (button) { button.disabled = true; button.textContent = 'Lettura in corso…'; }
  let releaseQueue;
  const previousRead = ocrQueue;
  const waitingForRead = ocrBusy;
  ocrBusy = true;
  ocrQueue = new Promise(resolve => { releaseQueue = resolve; });
  let worker;
  try {
    if (waitingForRead) stat.textContent = 'In attesa dell’altra lettura OCR…';
    await previousRead;
    activeOcrStatus = stat;
    stat.textContent = 'Caricamento del riconoscimento…';
    worker = await ensureOcrWorker();
    stat.textContent = 'Preparazione delle colonne della distinta…';
    const prepared = await prepareLineupImage(photos[side].blob);
    const namePasses = [];
    for (let variant = 0; variant < prepared.nameCrops.length; variant++) {
      for (const mode of ['4','6','11','12']) {
        await worker.setParameters({ tessedit_pageseg_mode: mode, preserve_interword_spaces: '1', tessedit_char_whitelist: '' });
        const result = await worker.recognize(prepared.nameCrops[variant]);
        const parsed = parseOcrNames(result.data.text || '');
        namePasses.push({ parsed, confidence: Number(result.data.confidence || 0), raw: result.data.text || '', variant, mode });
      }
    }
    const names = selectOcrNameConsensus(namePasses);

    const readNumberZone = async (canvas) => {
      const passes = [];
      for (const mode of ['6','11','12']) {
        await worker.setParameters({ tessedit_pageseg_mode: mode, preserve_interword_spaces: '1', tessedit_char_whitelist: '0123456789Il|.' });
        const result = await worker.recognize(canvas);
        passes.push({ nums: parseOcrNumbers(result.data.text || ''), confidence: Number(result.data.confidence || 0) });
      }
      passes.sort((a,b) => (b.nums.length * 10 + b.confidence * .02) - (a.nums.length * 10 + a.confidence * .02));
      return passes[0] || { nums: [], confidence: 0 };
    };
    const insideNumbers = await readNumberZone(prepared.numberCrop);
    let numberSource = 'colonna N° del Ruolo';
    let bestNumbers = insideNumbers;
    // Se la colonna ufficiale è vuota/parzialmente compilata, prova i numeri
    // manoscritti immediatamente a sinistra della tabella.
    if (insideNumbers.nums.length < names.length) {
      const marginNumbers = await readNumberZone(prepared.leftMarginNumberCrop);
      if (marginNumbers.nums.length > bestNumbers.nums.length) {
        bestNumbers = marginNumbers;
        numberSource = 'numeri manoscritti a sinistra della tabella';
      }
    }
    const numbers = bestNumbers.nums;

    if (!names.length) {
      stat.textContent = 'Non riesco a leggere i nominativi. La foto non è stata importata: prova a ritagliare la tabella e fotografarla più frontalmente.';
      return;
    }
    // Non bloccare l'importazione se l'OCR dei numeri manoscritti è incerto:
    // conserva l'ordine delle righe e lascia un segnaposto da correggere.
    const players = names.map((p,i) => ({ num: numbers[i] || '', name: p.name, starter: !p.reserve }));
    const hasR = names.some(p => p.reserve);
    if (!hasR && players.length > 11) players.forEach((p,i) => { p.starter = i < 11; });
    const starters = players.filter(p => p.starter), bench = players.filter(p => !p.starter);
    const format = p => (p.num ? p.num + ' ' : '') + p.name;
    const output = starters.map(format);
    if (bench.length) { output.push('---'); bench.forEach(p => output.push(format(p))); }
    if (matchId !== currentMatchId() || photos[side] !== photo) { toast('Lettura distinta scartata: partita o foto cambiata nel frattempo.'); return; }
    const field = document.querySelector('[data-roster="' + side + '"]');
    if (!field) throw new Error('Campo formazione non trovato.');
    field.value = output.join('\n');
    field.dispatchEvent(new Event('input', { bubbles: true }));
    const warnings = [];
    if (numbers.length !== names.length) warnings.push('numeri letti ' + numbers.length + ' su ' + names.length + ' da ' + numberSource + ': completa i numeri mancanti');
    if (starters.length !== 11) warnings.push(starters.length + ' titolari rilevati');
    stat.textContent = 'Importati ' + players.length + ' nominativi (' + starters.length + ' titolari, ' + bench.length + ' riserve). ' +
      (warnings.length ? 'Da verificare: ' + warnings.join(' · ') + '. ' : '') +
      'Fonte numeri: ' + numberSource + '. Controlla i numeri di maglia e correggi eventuali errori prima di salvare.';
  } catch (error) {
    console.error(error);
    await resetOcrWorker();
    stat.textContent = 'Lettura non riuscita: ' + (error.message || 'controlla la foto e riprova.');
  } finally {
    if (activeOcrStatus === stat) activeOcrStatus = null;
    ocrBusy = false;
    releaseQueue();
    if (button) { button.disabled = false; button.textContent = 'Leggi e prepara la formazione'; }
  }
}
