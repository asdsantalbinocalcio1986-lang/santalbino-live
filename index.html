/* Layout: tabellone con campo stilizzato in alto; sotto, cronaca a timeline per il pubblico e schede di regia per chi gestisce la partita */
:root{
  --bg:#eef2ec; --surface:#ffffff; --surface2:#e4eae2; --ink:#10201a; --muted:#56655c; --line:#d3dcd1;
  --accent:#157a3c; --accent-ink:#ffffff; --live:#e5372b;
  --c-goal:#168f4b; --c-yellow:#d9a400; --c-red:#d4372b; --c-sub:#2d7fd1; --c-injury:#d97a12; --c-save:#7156c4; --c-miss:#667770; --c-note:#667770; --c-mvp:#b58000;
  --hero1:#0a2b19; --hero2:#17663a;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09100d; --surface:#121c17; --surface2:#1b2822; --ink:#e8f0ec; --muted:#93a69b; --line:#25352d;
    --accent:#4fcb85; --accent-ink:#06150c; --live:#ff5a4d;
    --c-goal:#3dd17e; --c-yellow:#f5c518; --c-red:#f0574a; --c-sub:#5aa7ee; --c-injury:#f2a038; --c-save:#a78bfa; --c-miss:#8fa196; --c-note:#8fa196; --c-mvp:#ffd24a;
    --hero1:#06150d; --hero2:#0f4a29; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09100d; --surface:#121c17; --surface2:#1b2822; --ink:#e8f0ec; --muted:#93a69b; --line:#25352d;
  --accent:#4fcb85; --accent-ink:#06150c; --live:#ff5a4d;
  --c-goal:#3dd17e; --c-yellow:#f5c518; --c-red:#f0574a; --c-sub:#5aa7ee; --c-injury:#f2a038; --c-save:#a78bfa; --c-miss:#8fa196; --c-note:#8fa196; --c-mvp:#ffd24a;
  --hero1:#06150d; --hero2:#0f4a29; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font:700 24px/1.1 var(--fd);letter-spacing:.03em;text-transform:uppercase;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}

/* barra alta */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:700 20px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.brand b{display:inline-block;background:var(--live);color:#fff;border-radius:6px;padding:3px 8px 1px;font-size:15px;letter-spacing:.1em}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* tabellone */
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;background:linear-gradient(165deg,var(--hero2),var(--hero1) 70%);padding:18px 14px 16px;margin-bottom:16px}
.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.13;pointer-events:none}
.hero-in{position:relative}
.comp{font:600 14px var(--fb);letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:.9}
.when{font-size:13px;text-align:center;opacity:.65;margin-top:2px;min-height:19px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:start;margin-top:14px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.tname{font:700 17px/1.05 var(--fd);letter-spacing:0;text-transform:uppercase;overflow-wrap:break-word;hyphens:manual;max-width:100%}
.badge{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.18);flex:none}
.badge img{width:100%;height:100%;object-fit:contain;display:block}
.badge i{font:800 30px/1 var(--fd);font-style:normal;color:#17663a;letter-spacing:.02em}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.score{display:flex;align-items:center;gap:6px;font:800 62px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.score i{font-style:normal;opacity:.5;font-size:44px}
.status{display:inline-flex;align-items:center;gap:7px;font:700 15px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:6px 12px 5px;border-radius:99px;white-space:nowrap}
.status.live{background:var(--live)}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.live .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:13px;opacity:.88;min-height:4px}
.scorers div{min-width:0;overflow-wrap:anywhere;line-height:1.5}
.scorers div:last-child{text-align:right}
@media (max-width:380px){.score{font-size:52px}.badge{width:62px;height:62px}.tname{font-size:15px}}

/* schede */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:14px;margin-bottom:16px}
.tab{flex:1;min-width:0;border:0;background:none;border-radius:10px;padding:9px 4px;font:700 15px var(--fb);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* timeline pubblica */
.tl-list{list-style:none;margin:0;padding:0;position:relative}
.tl-list::before{content:"";position:absolute;left:62px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{display:grid;grid-template-columns:50px 26px 1fr;gap:10px;align-items:start;margin-bottom:12px;position:relative}
.tl-min{font:800 24px/1 var(--fd);text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.tl-ic{width:26px;height:26px;border-radius:50%;background:var(--col,var(--c-note));color:#fff;display:grid;place-items:center;margin-top:10px;box-shadow:0 0 0 4px var(--bg);z-index:1}
.tl-ic svg{width:15px;height:15px;display:block}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-width:0}
.tl.goal .tl-card{border-color:var(--c-goal);box-shadow:0 0 0 1px var(--c-goal) inset}
.tl-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tl-title{white-space:nowrap;font:700 15px/1.2 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--col,var(--muted))}
.tl-team{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex:0 1 auto}
.tl-team .badge{width:22px;height:22px;box-shadow:none;border:1px solid var(--line)}
.tl-team .badge i{font-size:11px}
.tl-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-main{font:700 24px/1.15 var(--fd);letter-spacing:.02em;text-transform:uppercase;margin-top:4px;overflow-wrap:anywhere}
.tl-sub{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}\n.tl-image-btn{margin-top:9px}\n#graphicDlg{width:min(92vw,560px);max-height:92dvh;overflow:auto;border:0;border-radius:18px;padding:16px;background:var(--surface);color:var(--ink);box-shadow:0 18px 60px rgba(0,0,0,.35)}\n#graphicDlg::backdrop{background:rgba(0,0,0,.72)}\n.graphic-preview{display:block;width:100%;max-height:68dvh;object-fit:contain;border-radius:12px;margin:0 auto 12px}
.tl.goal .tl-sub b{color:var(--ink)}
.tl-phase{display:grid;grid-template-columns:50px 26px 1fr;gap:10px;align-items:center;margin:4px 0 14px}
.tl-phase .tl-ic{margin:0;background:var(--ink);color:var(--bg)}
.tl-phase .tl-ph{font:700 15px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty h3{font:700 22px var(--fd);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:0 0 4px}

/* migliore in campo */
.tl.mvp .tl-card{border-color:var(--c-mvp);box-shadow:0 0 0 1px var(--c-mvp) inset}
.mvp-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mvp-box h3{margin:0 0 4px;font:800 28px/1.05 var(--fd);letter-spacing:.03em;text-transform:uppercase}
.count{display:inline-block;font:800 30px/1 var(--fd);font-variant-numeric:tabular-nums;color:var(--c-mvp);margin:6px 0 10px}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
@media (max-width:420px){.cands{grid-template-columns:1fr}}
.cand{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.cand .badge{width:26px;height:26px;box-shadow:none;border:1px solid var(--line)}
.cand .badge i{font-size:12px}
.cand b{font:700 18px var(--fd);color:var(--muted);min-width:22px;text-align:right}
.cand span{overflow-wrap:anywhere;min-width:0}
.mvp-img{display:block;width:100%;max-width:520px;margin:10px auto;border-radius:16px;border:1px solid var(--line)}
.rank{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-top:8px}
.rank .bar{grid-column:1/-1}
.vrow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;margin-bottom:8px}
.vrow span{overflow-wrap:anywhere;min-width:0}
/* statistiche */
.stat{margin-bottom:16px}
.stat-h{display:grid;grid-template-columns:44px 1fr 44px;align-items:baseline;gap:8px}
.stat-h b{font:800 26px/1 var(--fd);font-variant-numeric:tabular-nums}
.stat-h b:last-child{text-align:right}
.stat-h span{text-align:center;font:600 13px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--surface2);display:flex}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.l{justify-content:flex-end}
.bar.r i{background:var(--c-sub)}

/* formazioni */
.lu{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.lu-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lu-h .badge{width:40px;height:40px;box-shadow:none;border:1px solid var(--line)}
.lu-h .badge i{font-size:17px}
.lu-h h3{margin:0;font:700 22px var(--fd);letter-spacing:.03em;text-transform:uppercase}
.pl{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl b{font:700 20px/1.2 var(--fd);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pl span{overflow-wrap:anywhere}
.lu h4{margin:12px 0 2px;font:600 13px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* regia */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--c-red);border-color:var(--c-red)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.sync b{display:inline-flex;align-items:center;gap:8px}
.sync b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.sync.dirty b::before,.sync.sending b::before{background:var(--c-yellow)}
.sync.error b::before{background:var(--c-red)}
.sync.local b::before{background:var(--muted)}
.phasebtn{margin-bottom:14px;min-height:54px;font:700 20px var(--fd);letter-spacing:.06em;text-transform:uppercase}
.clockrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.clockrow .big{font:800 34px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.qb{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;font:700 21px var(--fd);letter-spacing:.04em;text-transform:uppercase}
.qb.goal{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qb>span{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,currentColor 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}.qb svg{width:27px;height:27px;flex:none;display:block}.qb{gap:12px;min-height:66px;padding:10px 12px;font-size:19px}.qb.goal>span{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent-ink) 15%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.f>span{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2.stack{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;margin-bottom:6px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.thumb{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0}
.ev{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .m{font:800 24px/1 var(--fd);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .t{white-space:pre-wrap;overflow-wrap:anywhere}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.chip.bozza{color:var(--c-injury)} .chip.pubblicato{color:var(--c-goal)}
dialog{margin:auto auto 0;width:min(100%,600px);max-height:94dvh;overflow:auto;border:0;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.sheethead h2{margin:0}

details{margin-top:8px} summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}

ol{padding-left:20px;margin:6px 0}

/* =========================================
   SANT'ALBINO LIVE - SPORT BROADCAST DESIGN
   Restyling pubblico e regia amministrativa
   ========================================= */

:root,
:root:not([data-theme="light"]),
:root[data-theme="dark"] {
  --bg: #080e0b;
  --surface: #121d17;
  --surface2: #1c2b22;
  --ink: #f2f7f3;
  --muted: #9aada0;
  --line: #304438;
  --accent: #a5e52d;
  --accent-ink: #101907;
  --live: #ff453a;
  --hero1: #07140c;
  --hero2: #164b27;
  --c-goal: #a5e52d;
  color-scheme: dark;
}

body {
  background:
    radial-gradient(ellipse at 50% -15%, #1b492a 0%, transparent 48%),
    linear-gradient(145deg, #080e0b, #0d1711 55%, #080e0b);
  color: var(--ink);
  min-height: 100vh;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
}

.top {
  padding: 12px 16px;
  background: linear-gradient(110deg, #14251a, #0c1510);
  border: 1px solid #344c39;
  border-radius: 16px;
  box-shadow: 0 8px 30px #0005;
  margin-bottom: 18px;
}

.brand {
  font-size: 25px;
  letter-spacing: .09em;
}

.brand b {
  background: linear-gradient(135deg, #c6f45a, #79bb20);
  color: #101907;
  box-shadow: 0 0 18px #a5e52d44;
}

.hero {
  background:
    radial-gradient(ellipse at 50% 0%, #347a3d 0%, transparent 65%),
    linear-gradient(145deg, #102b19, #06100a 85%);
  border: 1px solid #497344;
  border-radius: 24px;
  padding: 28px 20px 24px;
  box-shadow: 0 14px 40px #0007, 0 0 24px #83d52a18;
}

.comp {
  color: #c9f58a;
  font-weight: 700;
}

.score {
  font-size: clamp(64px, 9vw, 94px);
  text-shadow: 0 0 25px #a5e52d30;
}

.status.live {
  box-shadow: 0 0 18px #ff453a55;
}

.badge {
  box-shadow: 0 0 0 4px #ffffff20, 0 8px 25px #0007;
}

.tabs {
  background: #101b14;
  border: 1px solid #2d4434;
  border-radius: 16px;
  padding: 6px;
  gap: 6px;
}

.tab {
  border-radius: 11px;
  padding: 12px 8px;
  transition: .2s ease;
}

.tab[aria-selected="true"] {
  background: linear-gradient(135deg, #c3f15a, #83c52a);
  color: #101907;
  box-shadow: 0 3px 14px #a5e52d30;
}

.card,
.lu,
.mvp-box,
.tl-card {
  background: linear-gradient(145deg, #17251c, #101a14);

/* =====================================
   SANT'ALBINO LIVE - PUBLIC MATCH CENTER

   ===================================== */

.broadcast-feed {
  margin-top: 4px;
}

.feed-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 16px;
}

.feed-head h2 {

}

.feed-kicker,
.lu-kicker {

  text-transform: uppercase;
}

.feed-count {
  flex: none;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.broadcast-feed .tl-list {
  padding: 2px 0 4px;
}

.broadcast-feed .tl-list::before {
  left: 62px;
  background: linear-gradient(var(--accent), var(--line) 28%, var(--line));
}

.broadcast-feed .tl {
  margin-bottom: 14px;
  gap: 10px;
}

.broadcast-feed .tl-min {
  padding: 8px 3px 0 0;
  color: var(--ink);
  font-size: 25px;
}

.broadcast-feed .tl-ic {
  margin-top: 8px;
  box-shadow: 0 0 0 4px var(--bg), 0 2px 8px #0002;
}

.broadcast-feed .tl-card {
  padding: 12px 14px;
  border-radius: 15px;
  box-shadow: 0 4px 14px #0000000b;
}

.broadcast-feed .tl-top {
  min-height: 22px;
}

.broadcast-feed .tl-title {
  font-size: 14px;
  letter-spacing: .13em;
}

.broadcast-feed .tl-main {
  margin-top: 7px;
  font-size: 25px;
}

.broadcast-feed .tl-sub {
  margin-top: 4px;
  line-height: 1.4;
}

.broadcast-feed .tl.goal .tl-card {
  background: color-mix(in srgb, var(--c-goal) 7%, var(--surface));
  border-width: 2px;
}

.broadcast-feed .tl.goal .tl-main {
  font-size: 29px;
}

.broadcast-feed .tl.red .tl-card {
  border-left: 4px solid var(--c-red);
}

.broadcast-feed .tl.yellow .tl-card {
  border-left: 4px solid var(--c-yellow);
}

.broadcast-feed .tl.sub .tl-card {
  border-left: 4px solid var(--c-sub);
}

.broadcast-feed .tl-phase {
  margin: 6px 0 16px;
}

.broadcast-feed .tl-phase .tl-ph {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface2);
  font-size: 13px;
}

.lu {
  overflow: hidden;
  padding: 0;
  border-radius: 18px;
  box-shadow: 0 5px 18px #0000000d;
}

.lu-h {
  padding: 15px 16px;
  margin: 0;
  background: linear-gradient(110deg, color-mix(in srgb, var(--accent) 13%, var(--surface)), var(--surface));
  border-bottom: 1px solid var(--line);
}

.lu-h .badge {
  width: 48px;
  height: 48px;
  border-radius: 12px;
}

.lu-kicker {
  margin-bottom: 3px;
  font-size: 10px;
}

.lu-h h3 {
  line-height: 1.05;
}

.lu-section {
  padding: 12px 16px 14px;
}

.lu-section h4 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 13px;
}

.lu-section h4 b {
  display: inline-grid;
  place-items: center;
  min-width: 25px;
  height: 25px;
  padding: 0 6px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--muted);
  font-size: 12px;
}

.pl-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 18px;
}

.pl-grid .pl {
  min-width: 0;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.pl-grid .pl b {
  display: grid;
  place-items: center;
  min-width: 30px;
  min-height: 30px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--accent);
  font-size: 18px;
}

.pl-grid .pl span {
  font-weight: 600;
  line-height: 1.2;
}

.bench-section {
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface2) 38%, var(--surface));
}

.pl-grid.bench .pl b {
  color: var(--muted);
  background: var(--surface);
}

@media (max-width: 480px) {

  }

  }

/* =====================================
   SANT'ALBINO LIVE - CARBON FIBER THEME
   Texture uniforme su tutta l'interfaccia
   ===================================== */
:root {
  --carbon-a: rgba(255,255,255,.035);
  --carbon-b: rgba(0,0,0,.16);
}
body {
  background-color:#080e0b;
  background-image:
    repeating-linear-gradient(45deg,var(--carbon-a) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-45deg,var(--carbon-b) 0 1px,transparent 1px 4px),
    radial-gradient(ellipse at 50% -15%,#1b492a 0%,transparent 48%),
    linear-gradient(145deg,#080e0b,#0d1711 55%,#080e0b);
  background-attachment:fixed;
}
.top,.tabs,.card,.lu,.mvp-box,.tl-card,.sync,dialog,.dialog,
.feed-count,.tl-phase .tl-ph,.pill,
.btn:not(.primary):not(.danger),.qb:not(.goal) {
  background-color:#121d17;
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.17) 0 1px,transparent 1px 4px),
    linear-gradient(145deg,#17251c,#101a14);
  background-blend-mode:soft-light,normal,normal;
}
.hero {
  background-color:#0b1c11;
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.19) 0 1px,transparent 1px 4px),
    radial-gradient(ellipse at 50% 0%,#347a3d 0%,transparent 65%),
    linear-gradient(145deg,#102b19,#06100a 85%);
  background-blend-mode:soft-light,normal,normal,normal;
}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea {
  background-color:#0b1510;
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.13) 0 1px,transparent 1px 4px);
}

/* SANT'ALBINO LIVE - PULSE INDICATORE PARTITA */
.status.live {
  background: #d92727 !important;
  border: 1px solid #ff7770;
  color: #fff !important;
  box-shadow: 0 0 0 2px #d9272733, 0 0 18px #ff302f99;
  animation: live-button-flash 1s ease-in-out infinite;
}
.status.live .dot {
  background: #fff;
  animation: none;
}

  0%, 100% { opacity: 1; box-shadow: 0 0 0 2px #d9272733, 0 0 18px #ff302f99; }
  50% { opacity: .58; box-shadow: 0 0 0 5px #d9272718, 0 0 5px #ff302f55; }
}
@media (prefers-reduced-motion: reduce) {
  .status.live { animation: none; }
}

function curMinute() {
  const c = S.clock;
  if (c.phase === 'p1' || c.phase === 'p2') {
    const base = c.phase === 'p1' ? 0 : 45, cap = c.phase === 'p1' ? 45 : 90;
    const m = base + Math.floor((Date.now() - c.t0) / 60000) + 1;
    return m > cap ? `${cap}+${m - cap}` : String(m);
  }
  return c.phase === 'ht' ? '45' : c.phase === 'ft' ? '90' : '';
}

function parseRoster(raw) {
  const out = []; let bench = false, count = 0;
  (raw || '').split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (/^[-–—=]{3,}$/.test(l) || /^panchina\b/i.test(l)) { bench = true; return; }
    const m = l.match(/^(\d{1,2})?[\s.\-–)\]]*(.+)$/); const name = (m[2] || '').trim(); if (!name) return;
    out.push({ num: m[1] || '', name, starter: !bench && count < 11 }); count++;
  });
  return out;
}
function resolvePlayer(side, str) {
  str = (str || '').trim();
  if (/^\d{1,2}$/.test(str)) { const p = parseRoster(S.rosters[side]).find(x => x.num === str); return p ? p.name : str; }
  return str;
}
function lineupText(side) {
  const pl = parseRoster(S.rosters[side]);
  const st = pl.filter(p => p.starter).map(p => (p.num ? p.num + ' ' : '') + p.name), bn = pl.filter(p => !p.starter).map(p => (p.num ? p.num + ' ' : '') + p.name);
  return `📋 FORMAZIONE ${teamName(side).toUpperCase()}\n` + st.join('\n') + (bn.length ? '\n\nIn panchina: ' + bn.join(', ') : '') + (S.match.hashtag ? `\n\n${S.match.hashtag}` : '');
}

async function castMvpVote(candidateKey) {
  if (mvpVoteBusy || !db) return;
  const vi = voteInfo();
  if (vi.state !== 'open') { toast('La votazione non è aperta'); return; }
  mvpVoteBusy = true;
  try {
    const candidate = candidates().find(c => c.key === candidateKey);
    if (!candidate) throw new Error('Candidato non valido');
    const { error } = await db.from('mvp_votes').insert({
      match_key: mvpPollKey(), voter_hash: voterId(), candidate_key: candidate.key,
      candidate_name: candidate.name, team: candidate.side, shirt_number: candidate.num
    });
    if (error) {
      if (error.code === '23505') throw new Error('Hai già espresso il tuo voto per questa partita.');
      throw new Error('Voto non registrato. Verifica la configurazione del sondaggio.');
    }
    try { localStorage.setItem('santalbino-mvp-vote:' + mvpPollKey(), candidateKey); } catch (e) {}
    await refreshMvpVotes();
    toast('Voto registrato. Grazie!');

  const ext = resized.blob.type === 'image/png' ? 'png' : resized.blob.type === 'image/webp' ? 'webp' : 'jpg';
  const path = `${folder}/${Date.now()}-${uid()}.${ext}`;
  const { error } = await db.storage.from(MEDIA_BUCKET).upload(path, resized.blob, {

  const { data } = db.storage.from(MEDIA_BUCKET).getPublicUrl(path);

function wrapCanvasText(ctx, text, maxWidth, maxLines, lineHeight) {
  const words = String(text || '').split(/\\s+/).filter(Boolean);
  const lines = []; let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width <= maxWidth || !line) line = test;
    else { lines.push(line); line = word; }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    const clipped = lines.slice(0, maxLines);
    let last = clipped[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
    clipped[maxLines - 1] = last.replace(/[\\s.,;:]+$/, '') + '…';
    return clipped;
  }
  return lines;
}

}

function resizeImage(file, max, type = 'image/jpeg', q = .82) {

// Normalizza ogni logo in un riquadro PNG trasparente 512×512.
// Il marchio viene sempre contenuto per intero, con margine di sicurezza.
function resizeLogo(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const size = 512, inner = 424;
      const scale = Math.min(inner / img.width, inner / img.height);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const x = c.getContext('2d');
      x.clearRect(0, 0, size, size);

  const items = S.events.map((e, i) => ({ e, sc: scoreAt(i) })).reverse().map(({ e, sc }) => {
    if (PHASE_EV[e.type]) return `<li class="tl-phase"><span></span><span class="tl-ic">${IC.clock}</span><span class="tl-ph">${PHASE_EV[e.type]}${e.type !== 'kickoff' ? ` · ${sc[0]}-${sc[1]}` : ''}</span></li>`;
    const d = describe(e, sc), side = e.team;
    return `<li class="tl ${e.type}" style="--col:${COL[e.type]}">

function statsHtml() {
  const cnt = (t, s) => S.events.filter(e => e.type === t && e.team === s).length;
  const goals = s => S.events.filter(e => e.type === 'goal' && scoringSide(e) === s).length;
  const shots = s => goals(s) + cnt('save', other(s)) + cnt('miss', s) + cnt('shot', s) + cnt('crossbar', s);
  const shotsOnTarget = s => goals(s) + cnt('save', other(s));
  const rows = [['Gol', goals('home'), goals('away')], ['Occasioni', cnt('miss', 'home') + goals('home'), cnt('miss', 'away') + goals('away')], ['Tiri', shots('home'), shots('away')], ['Tiri in porta', shotsOnTarget('home'), shotsOnTarget('away')], ['Calci d’angolo', cnt('corner', 'home'), cnt('corner', 'away')], ['Gialli', cnt('yellow', 'home'), cnt('yellow', 'away')], ['Rossi', cnt('red', 'home'), cnt('red', 'away')], ['Sostituzioni', cnt('sub', 'home'), cnt('sub', 'away')]];
  if (!S.events.length) return `<div class="empty"><h3>Nessun dato</h3>Le statistiche compaiono durante la partita.</div>`;
  return `<div class="card">` + rows.map(([l, a, b]) => { const t = (a + b) || 1; return `<div class="stat"><div class="stat-h"><b>${a}</b><span>${l}</span><b>${b}</b></div><div class="bars"><div class="bar l"><i style="width:${a / t * 100}%"></i></div><div class="bar r"><i style="width:${b / t * 100}%"></i></div></div></div>`; }).join('') + `</div>`;
}
function lineupsHtml() {

/* ================= migliore in campo ================= */
const VOTE_MS = 12 * 3600 * 1000;
function voteInfo() {
  const ft = [...S.events].reverse().find(e => e.type === 'fulltime');
  if (!ft) return { state: 'none' };
  const end = ft.ts + VOTE_MS, mv = S.events.find(e => e.type === 'mvp');
  return { state: mv ? 'done' : (Date.now() < end ? 'open' : 'closed'), end, mv };
}
function leftText(ms) { const m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`; }
function candidates() {
  const out = [];
  ['home', 'away'].forEach(s => { if (S.mvp.ourOnly && s !== S.match.ourSide) return; parseRoster(S.rosters[s]).forEach(p => out.push({ side: s, num: p.num, name: p.name, key: s + '|' + p.name })); });
  return out;
}


function mvpPublicHtml() {
  const vi = voteInfo();
  const C = candidates();
  const voted = (() => {
    try {
      return localStorage.getItem('santalbino-mvp-vote:' + mvpPollKey()) || '';
    } catch (e) {
      return '';
    }
  })();

  if (vi.state === 'none') {
    return `<div class="empty"><h3>Migliore in campo</h3>La votazione si apre automaticamente al fischio finale e resta aperta 12 ore.</div>`;
  }

  if (vi.state === 'open') {
    return `<div class="mvp-box">
      <h3>Vota il migliore in campo</h3>
      <div class="muted">La votazione chiude tra</div>
      <div class="count" id="mvpCount">${leftText(vi.end - Date.now())}</div>
      ${voted
        ? `<p class="small" style="color:var(--c-goal);font-weight:700">Hai già votato. Grazie per aver partecipato!</p>`
        : `<p class="small muted">Scegli un giocatore. È possibile esprimere un solo voto per partita da questo dispositivo.</p>`}
      ${C.length
        ? `<div class="cands">${C.map(c => `<div class="cand">
            <span style="flex:1"><b>${esc(c.num)}</b> ${esc(c.name)}
            <small class="muted"> · ${esc(teamName(c.side))}</small></span>
            ${!voted ? `<button class="btn sm primary" data-vote-candidate="${esc(c.key)}">Vota</button>` : ''}
          </div>`).join('')}</div>`
        : '<p class="muted">Le formazioni non sono ancora disponibili.</p>'}
      <p class="small muted">I risultati della votazione sono riservati alla società.</p>
    </div>`;
  }

  return `<div class="mvp-box">
    <h3>Votazione conclusa</h3>
    <p class="muted">I risultati sono riservati alla società. Grazie a tutti per aver partecipato!</p>
  </div>`;
}

function buildMatchReport() {
  const [h, a] = scoreOf(S.events), date = fmtDate(S.match.date), title = `${teamName('home')} ${h}-${a} ${teamName('away')}`;
  const meta = [S.match.comp, date, S.match.venue].filter(Boolean).join(' · ');
  const goals = S.events.filter(e => e.type === 'goal').map(e => {
    const side = scoringSide(e), name = e.player || 'un giocatore';
    const method = e.kind === 'autogol' ? ' (autogol)' : e.kind === 'rigore' ? ' (su rigore)' : e.kind === 'punizione' ? ' (su punizione)' : e.kind === 'testa' ? ' (di testa)' : '';
    return `${e.min ? e.min + '′ ' : ''}${name} (${teamName(side)})${method}`;
  });
  const opening = `Si chiude sul risultato di ${h}-${a} la partita tra ${teamName('home')} e ${teamName('away')}${meta ? ', valida per ' + meta : ''}.`;
  const paragraphs = [opening];
  if (goals.length) paragraphs.push(`Le reti: ${goals.join('; ')}.`);
  else paragraphs.push('La gara si conclude senza reti.');
  const details = S.events
    .filter(e => !['goal','kickoff','halftime','secondhalf','fulltime','mvp'].includes(e.type))
    .map(e => buildText(e, scoreAt(S.events.indexOf(e))).replace(/\n/g, ' '));
  if (details.length) paragraphs.push(`Nel corso dell'incontro: ${details.join(' ')}`);
  const mvp = S.events.find(e => e.type === 'mvp');
  if (mvp) paragraphs.push(`Il pubblico ha scelto ${mvp.player} (${teamName(mvp.team)}) come migliore in campo${mvp.votes ? ', con ' + mvp.votes + ' voti' : ''}.`);
  return `RESOCONTO FINALE\n${title}\n${meta}\n\n${paragraphs.join('\n\n')}\n\n${S.match.hashtag || ''}`.trim();
}

/* lettura della formazione dalla foto, fatta da Claude */

async function readLineup(side, stat) {
  if (!photos[side]) {
    toast('Prima scegli la foto');
    return;
  }

  if (!window.Tesseract) {
    stat.textContent = 'Motore OCR non caricato. Aggiorna la pagina e riprova.';
    return;
  }

  stat.textContent = 'Preparazione della lettura...';

  try {
    const result = await Tesseract.recognize(
      photos[side].blob,
      'ita',
      {
        logger: message => {
          if (message.status === 'recognizing text') {
            stat.textContent =
              'Riconoscimento testo: ' +
              Math.round((message.progress || 0) * 100) + '%';
          }
        }
      }
    );

    const text = result.data.text || '';

    const lines = text
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean);

    const players = [];

    for (const line of lines) {
      const clean = line.replace(/\s+/g, ' ').trim();

      if (
        /^(titolari|formazione|panchina|riserve|a disposizione|allenatore|dirigente)/i.test(clean)
      ) continue;

      const match = clean.match(/^(\d{1,2})[\s.)\-:]+(.{3,})$/);

      if (match) {
        players.push({
          n: match[1],
          nome: match[2].trim()
        });
      }
    }

    if (!players.length) {
      stat.textContent =
        'Nessun giocatore riconosciuto con sicurezza. Prova una foto più nitida.';
      return;
    }

    const titolari = players.slice(0, 11);
    const panchina = players.slice(11);

    const format = p =>
      `${p.n} ${p.nome}`.trim();

    const output = titolari.map(format);

    if (panchina.length) {
      output.push('---');
      panchina.forEach(p => output.push(format(p)));
    }

    const field = document.querySelector(
      `[data-roster="${side}"]`
    );

    field.value = output.join('\n');
    field.dispatchEvent(new Event('input', { bubbles: true }));

    stat.textContent =
      `Riconosciuti ${players.length} giocatori. Controlla e correggi la lista prima di salvare.`;

  } catch (error) {
    console.error(error);
    stat.textContent =
      'Lettura non riuscita. Controlla la foto e riprova.';
  }
}

(async function start() {
  ROOT = $('#root');
  const mk = (tag, id) => { const d = document.createElement(tag); d.id = id; document.body.appendChild(d); return d; };
  mk('dialog', 'sheet').setAttribute('aria-label', 'Nuovo evento'); mk('dialog', 'postDlg').setAttribute('aria-label', 'Pubblica su Facebook'); mk('dialog', 'graphicDlg').setAttribute('aria-label', 'Immagine evento');
  const auth = mk('dialog','authDlg'); auth.innerHTML = `<form id="authForm"><div class="sheethead"><h2>Accesso amministratore</h2><button type="button" class="btn sm" id="authClose">Chiudi</button></div><label class="f"><span>Email</span><input id="authEmail" type="email" autocomplete="username" required></label><label class="f"><span>Password</span><input id="authPassword" type="password" autocomplete="current-password" required></label><p id="authError" class="small muted"></p><button class="btn primary block" type="submit">Accedi</button><button class="btn block" type="button" id="forgotPassword">Recupera password</button></form>`;
  const recovery = mk('dialog','recoveryDlg'); recovery.innerHTML = `<form id="recoveryForm"><div class="sheethead"><h2>Imposta una nuova password</h2><button type="button" class="btn sm" id="recoveryClose">Chiudi</button></div><label class="f"><span>Nuova password (almeno 8 caratteri)</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="f"><span>Ripeti la nuova password</span><input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required></label><p id="recoveryError" class="small muted"></p><button class="btn primary block" type="submit">Salva nuova password</button></form>`;
  $('#authForm').addEventListener('submit', e => {e.preventDefault(); signInAdmin();}); $('#authClose').addEventListener('click',()=>auth.close());
  $('#forgotPassword').addEventListener('click', requestPasswordReset);
  $('#recoveryForm').addEventListener('submit', e => {e.preventDefault(); saveNewPassword();});
  $('#recoveryClose').addEventListener('click',()=>recovery.close());
  ['home', 'away'].forEach(s => mk('datalist', 'dl-' + s));
  wireSheet();
  renderAll();
  setInterval(tickClock, 1000);
  await initCaps();
  if (CAN_EDIT) L.mode = 'regia'; else L.mode = 'public';
  if (LOCAL_ONLY) toast('Database non configurato: consulta la guida di installazione');
  updDatalists();
  $('#top').innerHTML = topHtml(); renderHero(); renderMain();
  const pend = stash.get('open-post'); if (pend && CAN_EDIT) { stash.del('open-post'); openPost(pend); }
})();
</script></body></html>
