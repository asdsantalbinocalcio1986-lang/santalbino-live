/* Layout: tabellone con campo stilizzato in alto; sotto, cronaca a timeline per il pubblico e schede di regia per chi gestisce la partita */
:root{
  --bg:#eef2ec; --surface:#ffffff; --surface2:#e4eae2; --ink:#10201a; --muted:#56655c; --line:#d3dcd1;
  --accent:#157a3c; --accent-ink:#ffffff; --live:#e5372b;
  --c-goal:#168f4b; --c-yellow:#d9a400; --c-red:#d4372b; --c-sub:#2d7fd1; --c-injury:#d97a12; --c-save:#7156c4; --c-miss:#667770; --c-note:#667770; --c-mvp:#b58000;
  --hero1:#0a2b19; --hero2:#17663a;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09100d; --surface:#121c17; --surface2:#1b2822; --ink:#e8f0ec; --muted:#93a69b; --line:#25352d;
    --accent:#4fcb85; --accent-ink:#06150c; --live:#ff5a4d;
    --c-goal:#3dd17e; --c-yellow:#f5c518; --c-red:#f0574a; --c-sub:#5aa7ee; --c-injury:#f2a038; --c-save:#a78bfa; --c-miss:#8fa196; --c-note:#8fa196; --c-mvp:#ffd24a;
    --hero1:#06150d; --hero2:#0f4a29; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09100d; --surface:#121c17; --surface2:#1b2822; --ink:#e8f0ec; --muted:#93a69b; --line:#25352d;
  --accent:#4fcb85; --accent-ink:#06150c; --live:#ff5a4d;
  --c-goal:#3dd17e; --c-yellow:#f5c518; --c-red:#f0574a; --c-sub:#5aa7ee; --c-injury:#f2a038; --c-save:#a78bfa; --c-miss:#8fa196; --c-note:#8fa196; --c-mvp:#ffd24a;
  --hero1:#06150d; --hero2:#0f4a29; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font:700 24px/1.1 var(--fd);letter-spacing:.03em;text-transform:uppercase;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}

/* barra alta */
.top{position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:700 20px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.brand b{display:inline-block;background:var(--live);color:#fff;border-radius:6px;padding:3px 8px 1px;font-size:15px;letter-spacing:.1em}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top-actions-desktop{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.mobile-actions{display:none;position:static;flex:none}
.mobile-actions>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:7px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer}
.mobile-actions>summary::-webkit-details-marker{display:none}
.mobile-actions[open]>summary{border-color:var(--accent)}
.mobile-actions-menu{position:absolute;z-index:60;left:50%;right:auto;top:calc(100% + 7px);transform:translateX(-50%);display:grid;gap:7px;width:min(280px,calc(100vw - 24px));padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.mobile-actions-menu .pill{width:100%;justify-content:flex-start;white-space:normal;text-align:left;border-radius:10px;min-height:42px}

/* tabellone */
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;background:linear-gradient(165deg,var(--hero2),var(--hero1) 70%);padding:18px 14px 16px;margin-bottom:16px}
.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.13;pointer-events:none}
.hero-in{position:relative}
.comp{font:600 14px var(--fb);letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:.9}
.when{font-size:13px;text-align:center;opacity:.65;margin-top:2px;min-height:19px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:start;margin-top:14px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.tname{font:700 17px/1.05 var(--fd);letter-spacing:0;text-transform:uppercase;overflow-wrap:break-word;hyphens:manual;max-width:100%}
.badge{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.18);flex:none}
.badge img{width:100%;height:100%;object-fit:contain;display:block}
.badge i{font:800 30px/1 var(--fd);font-style:normal;color:#17663a;letter-spacing:.02em}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.score{display:flex;align-items:center;gap:6px;font:800 62px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.score i{font-style:normal;opacity:.5;font-size:44px}
.status{display:inline-flex;align-items:center;gap:7px;font:700 15px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:6px 12px 5px;border-radius:99px;white-space:nowrap}
.status.live{background:var(--live)}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.live .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:13px;opacity:.88;min-height:4px}
.scorers div{min-width:0;overflow-wrap:anywhere;line-height:1.5}
.scorers div:last-child{text-align:right}
.mobile-primary{display:none}
@media (max-width:600px){.top{align-items:center;flex-wrap:nowrap}.top-actions-desktop{display:none}.mobile-actions{display:block}.mobile-primary{display:inline-flex;flex:none;white-space:nowrap}.brand{flex:1 1 auto}.brand span{max-width:38vw}}
@media (max-width:380px){.score{font-size:52px}.badge{width:62px;height:62px}.tname{font-size:15px}}

/* schede */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:14px;margin-bottom:16px}
.tab{flex:1;min-width:0;border:0;background:none;border-radius:10px;padding:9px 4px;font:700 15px var(--fb);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* timeline orizzontale sintetica della regia */
.match-timeline{display:grid;grid-template-columns:68px minmax(0,1fr);grid-template-rows:1fr 1px 1fr;gap:0 10px;min-height:132px;padding:16px 8px;overflow:visible;background:var(--bg);border:1px solid var(--line);border-radius:14px}.regia-timeline-panel{border:2px solid var(--accent)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}.regia-timeline-panel h2{display:flex;align-items:center;gap:8px}.regia-timeline-panel .match-tl-track{height:3px}.regia-timeline-panel .match-tl-axis{height:4px;top:-1px}.regia-timeline-panel .match-tl-marker i{width:3px;height:13px}.regia-timeline-panel .match-tl-marker b{font-size:13px}
.match-tl-lane{font:700 12px/1.1 var(--fd);letter-spacing:.04em;text-transform:uppercase;align-self:center}
.santa-label{grid-column:1;grid-row:1;color:var(--accent)}
.opponent-label{grid-column:1;grid-row:3;color:var(--c-sub)}
.match-tl-track{grid-column:2;grid-row:2;position:relative;height:1px;background:var(--line);margin:0 4px}
.match-tl-axis{position:absolute;inset:0;height:3px;top:-1px;background:var(--line);border-radius:3px}
.match-tl-tick{position:absolute;left:var(--x);top:50%;height:1px;transform:translateX(-50%);pointer-events:none}
.match-tl-tick i{position:absolute;left:0;top:-5px;width:1px;height:11px;background:var(--muted)}
.match-tl-tick b{position:absolute;left:0;top:27px;transform:translateX(-50%);font:600 10px/1 var(--fb);color:var(--muted);white-space:nowrap}
.match-tl-tick.half i{width:2px;height:17px;top:-8px;background:var(--ink)}
.match-tl-marker{position:absolute;left:var(--x);top:50%;width:0;height:0;z-index:2}
.match-tl-marker i{position:absolute;left:-1px;width:2px;height:9px;background:currentColor}
.match-tl-marker b{position:absolute;left:0;transform:translateX(-50%);font:800 12px/1 var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap;color:currentColor}
.match-tl-marker.santa{color:var(--accent)}
.match-tl-marker.santa i{bottom:0;transform:translateY(-1px)}
.match-tl-marker.santa b{bottom:calc(10px + var(--stack)*15px)}
.match-tl-marker.opponent{color:var(--c-sub)}
.match-tl-marker.opponent i{top:0;transform:translateY(1px)}
.match-tl-marker.opponent b{top:calc(10px + var(--stack)*15px)}
@media(max-width:420px){.match-timeline{grid-template-columns:56px minmax(0,1fr);gap:0 7px;padding-inline:0}.match-tl-lane{font-size:11px}.match-tl-marker b{font-size:11px}.match-tl-tick b{font-size:9px}}
/* timeline pubblica */
.tl-list{list-style:none;margin:0;padding:0;position:relative}
.tl-list::before{content:"";position:absolute;left:62px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{display:grid;grid-template-columns:50px 26px 1fr;gap:10px;align-items:start;margin-bottom:12px;position:relative}
.tl-min{font:800 24px/1 var(--fd);text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.tl-ic{width:28px;height:28px;border-radius:50%;background:var(--col,var(--c-note));color:#fff;display:grid;place-items:center;margin-top:10px;box-shadow:0 0 0 4px var(--bg);z-index:1}
.tl-ic svg{width:20px;height:20px;display:block;overflow:visible;filter:drop-shadow(0 1px 1px #0002)}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-width:0}
.tl.goal .tl-card{border-color:var(--c-goal);box-shadow:0 0 0 1px var(--c-goal) inset}
.tl-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tl-title{white-space:nowrap;font:700 15px/1.2 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--col,var(--muted))}
.tl-team{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex:0 1 auto}
.tl-team .badge{width:22px;height:22px;box-shadow:none;border:1px solid var(--line)}
.tl-team .badge i{font-size:11px}
.tl-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-main{font:700 24px/1.15 var(--fd);letter-spacing:.02em;text-transform:uppercase;margin-top:4px;overflow-wrap:anywhere}
.tl-sub{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tl-image-btn{margin-top:9px}
#graphicDlg{width:min(92vw,560px);max-height:92dvh;overflow:auto;border:0;border-radius:18px;padding:16px;background:var(--surface);color:var(--ink);box-shadow:0 18px 60px rgba(0,0,0,.35)}
#graphicDlg::backdrop{background:rgba(0,0,0,.72)}
.graphic-preview{display:block;width:100%;max-height:68dvh;object-fit:contain;border-radius:12px;margin:0 auto 12px}
.tl.goal .tl-sub b{color:var(--ink)}
.tl-phase{display:grid;grid-template-columns:50px 26px 1fr;gap:10px;align-items:center;margin:4px 0 14px}
.tl-phase .tl-ic{margin:0;background:var(--ink);color:var(--bg)}
.tl-phase .tl-ph{font:700 15px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty h3{font:700 22px var(--fd);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:0 0 4px}

/* migliore in campo */
.tl.mvp .tl-card{border-color:var(--c-mvp);box-shadow:0 0 0 1px var(--c-mvp) inset}
.mvp-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mvp-box h3{margin:0 0 4px;font:800 28px/1.05 var(--fd);letter-spacing:.03em;text-transform:uppercase}
.count{display:inline-block;font:800 30px/1 var(--fd);font-variant-numeric:tabular-nums;color:var(--c-mvp);margin:6px 0 10px}
.mvp-team-group{margin:14px 0 18px}
.mvp-team-title{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:0 0 7px;border-bottom:1px solid var(--line);font:800 17px/1.2 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.cands{display:grid;grid-template-columns:1fr;gap:8px;margin:0}

.cand{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.cand .badge{width:26px;height:26px;box-shadow:none;border:1px solid var(--line)}
.cand .badge i{font-size:12px}
.cand b{font:700 18px var(--fd);color:var(--muted);min-width:22px;text-align:right}
.cand span{overflow-wrap:anywhere;min-width:0}
.mvp-img{display:block;width:100%;max-width:520px;margin:10px auto;border-radius:16px;border:1px solid var(--line)}
.rank{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-top:8px}
.rank .bar{grid-column:1/-1}
.vrow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;margin-bottom:8px}
.vrow span{overflow-wrap:anywhere;min-width:0}
/* statistiche */
.stat{margin-bottom:16px}
.stat-h{display:grid;grid-template-columns:44px 1fr 44px;align-items:baseline;gap:8px}
.stat-h>span{min-width:0;overflow-wrap:anywhere;word-break:normal}
.stat-h b{font:800 26px/1 var(--fd);font-variant-numeric:tabular-nums}
.stat-h b:last-child{text-align:right}
.stat-h span{text-align:center;font:600 13px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--surface2);display:flex}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.l{justify-content:flex-end}
.bar.r i{background:var(--c-sub)}

/* formazioni */
.lu{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.lu-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lu-h .badge{width:40px;height:40px;box-shadow:none;border:1px solid var(--line)}
.lu-h .badge i{font-size:17px}
.lu-h h3{margin:0;font:700 22px var(--fd);letter-spacing:.03em;text-transform:uppercase}
.pl{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl b{font:700 20px/1.2 var(--fd);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pl span{overflow-wrap:anywhere}
.lu h4{margin:12px 0 2px;font:600 13px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* regia */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--c-red);border-color:var(--c-red)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.sync b{display:inline-flex;align-items:center;gap:8px}
.sync b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.sync.dirty b::before,.sync.sending b::before{background:var(--c-yellow)}
.sync.error b::before{background:var(--c-red)}
.sync.local b::before{background:var(--muted)}
.phasebtn{margin-bottom:14px;min-height:54px;font:700 20px var(--fd);letter-spacing:.06em;text-transform:uppercase}
.clockrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.clockrow .big{font:800 34px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:20px}
.qb{display:flex;align-items:center;gap:13px;min-width:0;min-height:72px;padding:10px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;font:700 18px var(--fd);letter-spacing:.035em;text-transform:uppercase;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.qb:active{transform:translateY(1px)}
.qb>span{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:11px;background:linear-gradient(145deg,color-mix(in srgb,currentColor 15%,transparent),color-mix(in srgb,currentColor 7%,transparent));border:1px solid color-mix(in srgb,currentColor 24%,transparent);box-shadow:inset 0 1px 0 #ffffff12,0 2px 5px #0002}
.qb svg{width:36px;height:36px;flex:none;display:block;overflow:visible;filter:drop-shadow(0 1px 1px #0002)}
.qb.goal{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qb.goal>span{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent-ink) 18%,transparent)}
@media(max-width:380px){.qb{gap:9px;padding:9px 10px;font-size:16px}.qb>span{width:42px;height:42px}.qb svg{width:30px;height:30px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.f>span{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2.stack{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;margin-bottom:6px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.thumb{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0}
.ev{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .m{font:800 24px/1 var(--fd);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .t{white-space:pre-wrap;overflow-wrap:anywhere}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.chip.bozza{color:var(--c-injury)} .chip.pubblicato{color:var(--c-goal)}
dialog{margin:auto auto 0;width:min(100%,600px);max-height:94dvh;overflow:auto;border:0;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.sheethead h2{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:200;max-width:92vw;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.busy{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font:700 22px var(--fd);letter-spacing:.08em;text-transform:uppercase}
details{margin-top:8px} summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
code{font-size:13px;background:var(--surface2);padding:1px 5px;border-radius:4px}
ol{padding-left:20px;margin:6px 0}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}

/* =========================================
   SANTA LIVE - SPORT BROADCAST DESIGN
   Restyling pubblico e regia amministrativa
   ========================================= */

:root,
:root:not([data-theme="light"]),
:root[data-theme="dark"] {
  --bg: #080e0b;
  --surface: #121d17;
  --surface2: #1c2b22;
  --ink: #f2f7f3;
  --muted: #9aada0;
  --line: #304438;
  --accent: #a5e52d;
  --accent-ink: #101907;
  --live: #ff453a;
  --hero1: #07140c;
  --hero2: #164b27;
  --c-goal: #a5e52d;
  color-scheme: dark;
}

body {
  background:
    radial-gradient(ellipse at 50% -15%, #1b492a 0%, transparent 48%),
    linear-gradient(145deg, #080e0b, #0d1711 55%, #080e0b);
  color: var(--ink);
  min-height: 100vh;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
}

.top {
  padding: 12px 16px;
  background: linear-gradient(110deg, #14251a, #0c1510);
  border: 1px solid #344c39;
  border-radius: 16px;
  box-shadow: 0 8px 30px #0005;
  margin-bottom: 18px;
}

.brand {
  font-size: 25px;
  letter-spacing: .09em;
}

.brand b {
  background: linear-gradient(135deg, #c6f45a, #79bb20);
  color: #101907;
  box-shadow: 0 0 18px #a5e52d44;
}

.hero {
  background:
    radial-gradient(ellipse at 50% 0%, #347a3d 0%, transparent 65%),
    linear-gradient(145deg, #102b19, #06100a 85%);
  border: 1px solid #497344;
  border-radius: 24px;
  padding: 28px 20px 24px;
  box-shadow: 0 14px 40px #0007, 0 0 24px #83d52a18;
}

.comp {
  color: #c9f58a;
  font-weight: 700;
}

.score {
  font-size: clamp(64px, 9vw, 94px);
  text-shadow: 0 0 25px #a5e52d30;
}

.status.live {
  box-shadow: 0 0 18px #ff453a55;
}

.badge {
  box-shadow: 0 0 0 4px #ffffff20, 0 8px 25px #0007;
}

.tabs {
  background: #101b14;
  border: 1px solid #2d4434;
  border-radius: 16px;
  padding: 6px;
  gap: 6px;
}

.tab {
  border-radius: 11px;
  padding: 12px 8px;
  transition: .2s ease;
}

.tab[aria-selected="true"] {
  background: linear-gradient(135deg, #c3f15a, #83c52a);
  color: #101907;
  box-shadow: 0 3px 14px #a5e52d30;
}

.card,
.lu,
.mvp-box,
.tl-card {
  background: linear-gradient(145deg, #17251c, #101a14);
  border: 1px solid #344b39;
  border-radius: 18px;
  box-shadow: 0 8px 24px #0003;
}

.tl.goal .tl-card {
  border-color: var(--c-goal);
  box-shadow: 0 0 18px #a5e52d20;
}

.btn {
  border-radius: 12px;
  border-color: #405b45;
  background: linear-gradient(145deg, #1b2b20, #121d16);
  transition: transform .18s ease, box-shadow .18s ease;
}

.btn.primary {
  background: linear-gradient(135deg, #c3f15a, #83c52a);
  color: #101907;
  border-color: #b4ed43;
  font-weight: 800;
  box-shadow: 0 5px 18px #a5e52d30;
}

.btn:active,
.qb:active {
  transform: scale(.98);
}

.qb {
  background: linear-gradient(145deg, #1b2c20, #101a14);
  border-color: #3b5540;
  border-radius: 16px;
  min-height: 72px;
  box-shadow: 0 5px 18px #0003;
}

.qb.goal {
  background: linear-gradient(135deg, #c3f15a, #83c52a);
  color: #101907;
  border-color: #b4ed43;
  box-shadow: 0 5px 20px #a5e52d35;
}

.sync {
  background: #142219;
  border-color: #3b5740;
  border-radius: 14px;
}

input[type=text],
input[type=number],
input[type=date],
input[type=search],
select,
textarea {
  background: #0b1510;
  color: #f2f7f3;
  border: 1px solid #3a5140;
  border-radius: 12px;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #a5e52d;
  box-shadow: 0 0 0 3px #a5e52d22;
}

.seg button[aria-pressed="true"] {
  background: linear-gradient(135deg, #c3f15a, #83c52a);
  color: #101907;
  border-color: #b4ed43;
}

.pill.on {
  background: #a5e52d;
  color: #101907;
  border-color: #a5e52d;
}

.dialog,
dialog {
  background: #121d17;
  color: #f2f7f3;
  border: 1px solid #3a5140;
}

@media (min-width: 760px) {
  body {
    padding: 24px;
  }

  .hero {
    padding: 34px 30px;
  }

  .tabs {
    margin-bottom: 22px;
  }

  .card,
  .lu,
  .mvp-box {
    padding: 20px;
  }

  .quick {
    gap: 14px;
  }
}

@media (max-width: 600px) {
  body {
    padding-left: 10px;
    padding-right: 10px;
  }

  .hero {
    padding: 22px 10px;
    border-radius: 19px;
  }

  .brand {
    font-size: 20px;
  }

  .tab {
    font-size: 13px;
    padding: 10px 3px;
  }

  .qb {
    font-size: 18px;
    min-height: 64px;
    padding: 9px;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .card,
  .lu,
  .mvp-box,
  .tl-card {
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .card:hover,
  .lu:hover,
  .mvp-box:hover {
    border-color: #739c55;
    box-shadow: 0 10px 28px #0005;
  }
}

/* =====================================
   SANTA LIVE - PUBLIC MATCH CENTER
   Cronaca e formazioni
   ===================================== */

.broadcast-feed {
  margin-top: 4px;
}

.feed-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 16px;
}

.feed-head h2 {
  margin: 2px 0 0;
  font-size: 27px;
}

.feed-kicker,
.lu-kicker {
  display: block;
  color: var(--accent);
  font: 800 11px/1.2 var(--fb);
  letter-spacing: .16em;
  text-transform: uppercase;
}

.feed-count {
  flex: none;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.broadcast-feed .tl-list {
  padding: 2px 0 4px;
}

.broadcast-feed .tl-list::before {
  left: 62px;
  background: linear-gradient(var(--accent), var(--line) 28%, var(--line));
}

.broadcast-feed .tl {
  margin-bottom: 14px;
  gap: 10px;
}

.broadcast-feed .tl-min {
  padding: 8px 3px 0 0;
  color: var(--ink);
  font-size: 25px;
}

.broadcast-feed .tl-ic {
  margin-top: 8px;
  box-shadow: 0 0 0 4px var(--bg), 0 2px 8px #0002;
}

.broadcast-feed .tl-card {
  padding: 12px 14px;
  border-radius: 15px;
  box-shadow: 0 4px 14px #0000000b;
}

.broadcast-feed .tl-top {
  min-height: 22px;
}

.broadcast-feed .tl-title {
  font-size: 14px;
  letter-spacing: .13em;
}

.broadcast-feed .tl-main {
  margin-top: 7px;
  font-size: 25px;
}

.broadcast-feed .tl-sub {
  margin-top: 4px;
  line-height: 1.4;
}

.broadcast-feed .tl.goal .tl-card {
  background: color-mix(in srgb, var(--c-goal) 7%, var(--surface));
  border-width: 2px;
}

.broadcast-feed .tl.goal .tl-main {
  font-size: 29px;
}

.broadcast-feed .tl.red .tl-card {
  border-left: 4px solid var(--c-red);
}

.broadcast-feed .tl.yellow .tl-card {
  border-left: 4px solid var(--c-yellow);
}

.broadcast-feed .tl.sub .tl-card {
  border-left: 4px solid var(--c-sub);
}

.broadcast-feed .tl-phase {
  margin: 6px 0 16px;
}

.broadcast-feed .tl-phase .tl-ph {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface2);
  font-size: 13px;
}

.lu {
  overflow: hidden;
  padding: 0;
  border-radius: 18px;
  box-shadow: 0 5px 18px #0000000d;
}

.lu-h {
  padding: 15px 16px;
  margin: 0;
  background: linear-gradient(110deg, color-mix(in srgb, var(--accent) 13%, var(--surface)), var(--surface));
  border-bottom: 1px solid var(--line);
}

.lu-h .badge {
  width: 48px;
  height: 48px;
  border-radius: 12px;
}

.lu-kicker {
  margin-bottom: 3px;
  font-size: 10px;
}

.lu-h h3 {
  line-height: 1.05;
}

.lu-section {
  padding: 12px 16px 14px;
}

.lu-section h4 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 13px;
}

.lu-section h4 b {
  display: inline-grid;
  place-items: center;
  min-width: 25px;
  height: 25px;
  padding: 0 6px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--muted);
  font-size: 12px;
}

.pl-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 18px;
}

.pl-grid .pl {
  min-width: 0;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.pl-grid .pl b {
  display: grid;
  place-items: center;
  min-width: 30px;
  min-height: 30px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--accent);
  font-size: 18px;
}

.pl-grid .pl span {
  font-weight: 600;
  line-height: 1.2;
}

.bench-section {
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface2) 38%, var(--surface));

function parseRoster(raw) {
  const out = []; let bench = false, count = 0;
  (raw || '').split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (/^[-–—=]{3,}$/.test(l) || /^panchina\b/i.test(l)) { bench = true; return; }
    const m = l.match(/^(\d{1,2})?[\s.\-–)\]]*(.+)$/);
    const rawName = (m[2] || '').trim(), goalkeeper = /\bGK\b/i.test(rawName);
    const name = rawName.replace(/\bGK\b/gi, '').replace(/\s{2,}/g, ' ').trim();
    if (!name) return;
    out.push({ num: m[1] || '', name, goalkeeper, starter: !bench && count < 11 }); count++;
  });
  return out;
}

function voterId() {

  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)) {
    if (crypto.randomUUID) id = crypto.randomUUID();
    else {
      const b = new Uint8Array(16);
      if (crypto.getRandomValues) crypto.getRandomValues(b);
      else for (let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256);
      b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
      const h = [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
      id = h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
    }
    try { localStorage.setItem(MVP_VOTER_KEY, id); } catch (e) {}
  }
  return id;
}

async function loadRegiaArchivePage(page = regiaArchivePage) {
  if (TEST_MODE || !db || regiaArchiveLoading) return;
  const nextPage = Math.max(0, Math.floor(Number(page) || 0));
  regiaArchiveLoading = true;
  regiaArchiveError = '';
  try {
    const from = nextPage * REGIA_ARCHIVE_PAGE_SIZE;
    const to = from + REGIA_ARCHIVE_PAGE_SIZE - 1;
    const { data, count, error } = await db.from('match_archive')
      .select('id,poll_id,match_date,competition,venue,home_team,away_team,home_score,away_score,state,archived_at', { count: 'exact' })
      .order('match_date', { ascending: false })
      .order('archived_at', { ascending: false })
      .range(from, to);
    if (error) throw error;
    regiaArchiveRows = data || [];
    regiaArchiveTotal = Number(count || 0);
    const lastPage = Math.max(0, Math.ceil(regiaArchiveTotal / REGIA_ARCHIVE_PAGE_SIZE) - 1);
    regiaArchivePage = Math.min(nextPage, lastPage);
    if (regiaArchivePage !== nextPage) {
      regiaArchiveLoading = false;
      return await loadRegiaArchivePage(regiaArchivePage);
    }
    regiaArchiveLoaded = true;
    regiaArchiveError = '';
  } catch (error) {
    console.warn('Caricamento archivio regia:', error);
    regiaArchiveLoaded = false;
    regiaArchiveError = error?.message || 'Errore di connessione';
  } finally {
    regiaArchiveLoading = false;
    if ($('#main') && L.mode === 'regia' && L.rtab === 'archive') renderMain();
  }
}


function seasonKeyForDate(value) {
  const m = String(value || '').match(/^(\d{4})-(\d{2})-\d{2}$/);
  if (!m) return '';
  const year = Number(m[1]), month = Number(m[2]);
  return String(month >= 7 ? year : year - 1);
}

function archiveOurSide(row, state) {
  const match = state?.match || {};
  if (match.ourSide === 'home' || match.ourSide === 'away') return match.ourSide;
  const norm = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const home = norm(row.home_team), away = norm(row.away_team);
  if (home.includes("sant'albino") || home.includes('sant albino')) return 'home';
  if (away.includes("sant'albino") || away.includes('sant albino')) return 'away';
  return '';
}

  const seasons = [...new Set([currentKey, ...archiveRows.map(r => seasonKeyForDate(r.match_date)).filter(Boolean)])].sort((a,b) => Number(b)-Number(a));
  const selected = seasons.includes(String(L.season || '')) ? String(L.season) : seasons[0];
  const rows = archiveRows.filter(r => seasonKeyForDate(r.match_date) === selected);
  const players = new Map();
  let ownGoalsFor = 0, goalsWithoutName = 0, teamGoals = 0;
  const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('it').replace(/[^a-z0-9]/g, '');
  rows.forEach(row => {
    const state = row.state || {}, side = archiveOurSide(row, state);
    if (!side) return;
    (Array.isArray(state.events) ? state.events : []).forEach(ev => {
      if (ev.type !== 'goal') return;
      const creditedSide = ev.kind === 'autogol' ? other(ev.team) : ev.team;
      if (creditedSide !== side) return;
      teamGoals++;
      if (ev.kind === 'autogol') { ownGoalsFor++; return; }
      const name = String(ev.player || '').trim();
      if (!name) { goalsWithoutName++; return; }
      const key = normalize(name);
      if (!key) { goalsWithoutName++; return; }
      const item = players.get(key) || { name, goals:0, assists:0 };
      item.goals++;
      if (name.length > item.name.length) item.name = name;
      players.set(key, item);
      const assist = String(ev.assist || '').trim(), assistKey = normalize(assist);
      if (assistKey) {
        const helper = players.get(assistKey) || { name:assist, goals:0, assists:0 };
        helper.assists++;
        if (assist.length > helper.name.length) helper.name = assist;
        players.set(assistKey, helper);
      }
    });
  });
  const ranking = [...players.values()].filter(p => p.goals > 0).sort((a,b) => b.goals-a.goals || b.assists-a.assists || a.name.localeCompare(b.name,'it'));
  const assists = [...players.values()].filter(p => p.assists > 0).sort((a,b) => b.assists-a.assists || b.goals-a.goals || a.name.localeCompare(b.name,'it'));
  const seasonButtons = seasons.map(key => '<button class="btn sm ' + (key === selected ? 'primary' : '') + '" data-season="' + key + '">' + esc(seasonLabel(key)) + '</button>').join('');
  const table = list => list.map((p,i) => '<div class="stat-h" style="grid-template-columns:32px minmax(0,1fr) auto;gap:8px;margin:8px 0"><b>' + (i+1) + '</b><span style="text-align:left;overflow-wrap:anywhere">' + esc(p.name) + (p.assists ? '<span class="small muted"> · ' + p.assists + ' assist</span>' : '') + '</span><b style="font-size:20px">' + p.goals + '</b></div>').join('');
  return '<div class="card"><h2>Marcatori · ' + esc(seasonLabel(selected)) + '</h2><p class="small muted">Classifica basata sui gol attribuiti ai giocatori nelle cronache delle partite archiviate. Gli autogol non vengono assegnati al giocatore che li ha commessi.</p><div class="row2" style="display:flex;flex-wrap:wrap;gap:7px;margin:12px 0">' + seasonButtons + '</div>' +
    (rows.length ? '<div class="grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0"><div class="card" style="margin:0;padding:12px"><div class="small muted">Gol Sant’Albino</div><div style="font:800 28px/1.1 var(--fd);margin-top:4px">' + teamGoals + '</div></div><div class="card" style="margin:0;padding:12px"><div class="small muted">Marcatori</div><div style="font:800 28px/1.1 var(--fd);margin-top:4px">' + ranking.length + '</div></div></div>' +
      (ranking.length ? '<h3>Classifica marcatori</h3><div class="stat-h" style="grid-template-columns:32px minmax(0,1fr) auto"><b>#</b><b style="text-align:left">Giocatore</b><b>Gol</b></div>' + table(ranking) : '<p class="small muted">Nessun gol individuale registrato per questa stagione.</p>') +
      (assists.length ? '<h3 style="margin-top:18px">Assist</h3><div class="stat-h" style="grid-template-columns:32px minmax(0,1fr) auto"><b>#</b><b style="text-align:left">Giocatore</b><b>Assist</b></div>' + assists.map((p,i) => '<div class="stat-h" style="grid-template-columns:32px minmax(0,1fr) auto;gap:8px;margin:8px 0"><b>' + (i+1) + '</b><span style="text-align:left;overflow-wrap:anywhere">' + esc(p.name) + '</span><b style="font-size:20px">' + p.assists + '</b></div>').join('') : '') +
      '<p class="small muted" style="margin-top:14px">Autogol a favore: ' + ownGoalsFor + ' · Gol senza marcatore indicato: ' + goalsWithoutName + '. Le classifiche considerano solo le gare in cui è identificabile il Sant’Albino.</p>' :
      '<div class="empty"><h3>Nessuna partita in questa stagione</h3><p>Non risultano partite archiviate nel periodo selezionato.</p></div>') +
    '</div>';
}

function seasonalStatsHtml() {
  if (!db) return '<div class="empty"><h3>Statistiche stagionali non disponibili</h3><p>La connessione al database non è attiva.</p></div>';
  if (!archiveLoaded) return '<div class="empty">Caricamento dati stagionali…</div>';
  if (!archiveRows.length) return '<div class="empty"><h3>Nessuna partita archiviata</h3><p>Le statistiche stagionali si aggiorneranno automaticamente dopo l’archiviazione delle partite concluse.</p></div>';
  const currentKey = seasonKeyForDate(new Date().toISOString().slice(0, 10));
  const seasons = [...new Set([currentKey, ...archiveRows.map(r => seasonKeyForDate(r.match_date)).filter(Boolean)])].sort((a,b) => Number(b)-Number(a));
  const selected = seasons.includes(String(L.season || '')) ? String(L.season) : seasons[0];
  const rows = archiveRows.filter(r => seasonKeyForDate(r.match_date) === selected);
  const totals = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, clean:0, yellow:0, red:0 };
  rows.forEach(row => {
    const state = row.state || {}, match = state.match || {};
    let side = match.ourSide === 'home' || match.ourSide === 'away' ? match.ourSide : '';
    if (!side) {
      const home = String(row.home_team || '').toLowerCase(), away = String(row.away_team || '').toLowerCase();
      if (home.includes("sant'albino") || home.includes('sant’albino')) side = 'home';
      else if (away.includes("sant'albino") || away.includes('sant’albino')) side = 'away';
    }
    if (!side) return;
    const gf = Math.max(0, Number(row[side + '_score']) || 0);
    const ga = Math.max(0, Number(row[other(side) + '_score']) || 0);
    totals.played++; totals.gf += gf; totals.ga += ga;
    if (gf > ga) totals.wins++; else if (gf === ga) totals.draws++; else totals.losses++;
    if (ga === 0) totals.clean++;
    (Array.isArray(state.events) ? state.events : []).forEach(ev => {
      if (ev.team === side && ev.type === 'yellow') totals.yellow++;
      if (ev.team === side && ev.type === 'red') totals.red++;
    });
  });
  const pct = n => totals.played ? Math.round(n / totals.played * 100) : 0;
  const metric = (label, value) => '<div class="stat-h" style="grid-template-columns:minmax(0,1fr) auto;margin:8px 0"><span style="text-align:left">' + label + '</span><b>' + value + '</b></div>';
  return '<div class="card"><h2>Stagione ' + esc(seasonLabel(selected)) + '</h2><p class="small muted">Dati ricavati esclusivamente dalle partite archiviate. La stagione sportiva è calcolata dal 1° luglio al 30 giugno.</p><div class="row2" style="grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px;margin:12px 0">' +
    seasons.map(key => '<button class="btn sm ' + (key === selected ? 'primary' : '') + '" data-season="' + key + '">' + esc(seasonLabel(key)) + '</button>').join('') +
    '</div>' +
    (rows.length ? '<div class="grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0">' +
      [['Partite',totals.played],['Vittorie',totals.wins],['Pareggi',totals.draws],['Sconfitte',totals.losses],['Gol fatti',totals.gf],['Gol subiti',totals.ga],['Clean sheet',totals.clean],['Media gol fatti', (totals.gf/totals.played).toFixed(2)],['Ammonizioni',totals.yellow],['Espulsioni',totals.red]].map(([label,value]) => '<div class="card" style="margin:0;padding:12px"><div class="small muted">' + label + '</div><div style="font:800 28px/1.1 var(--fd);margin-top:4px">' + value + '</div></div>').join('') +
      '</div><h3>Bilancio risultati</h3><div class="stat-h"><b>' + totals.wins + '</b><span>Vittorie · ' + pct(totals.wins) + '%</span><b>' + totals.losses + '</b></div><div class="bars"><div class="bar l"><i style="width:' + pct(totals.wins) + '%"></i></div><div class="bar r"><i style="width:' + pct(totals.losses) + '%"></i></div></div><p class="small muted" style="margin-top:10px">Pareggi: ' + totals.draws + ' (' + pct(totals.draws) + '%). I dati non comprendono partite non ancora archiviate o prive dell’indicazione della nostra squadra.</p>' :
      '<div class="empty"><h3>Nessun dato per questa stagione</h3><p>Non risultano partite archiviate nel periodo selezionato.</p></div>') +
    '</div>';
}

function archiveHtml() {
  if (!db) return '<div class="empty"><h3>Archivio non disponibile</h3><p>La connessione al database non è attiva.</p></div>';
  const canDelete = CAN_EDIT && L.mode === 'regia';
  if (canDelete && regiaArchiveLoading) return '<div class="empty">Caricamento archivio partite…</div>';
  if (canDelete && !regiaArchiveLoaded) return `<div class="card"><h3>Archivio non caricato</h3><p class="small muted">${esc(regiaArchiveError || 'Controlla la connessione e riprova.')}</p><button class="btn" data-a="reloadArchive">Riprova</button></div>`;
  if (!canDelete && archiveLoading) return '<div class="empty">Caricamento archivio partite…</div>';
  if (!canDelete && !archiveLoaded) return `<div class="card"><h3>Archivio non caricato</h3><p class="small muted">${esc(archiveError || 'Controlla la connessione e riprova.')}</p><button class="btn" data-a="reloadArchive">Riprova</button></div>`;
  const rows = canDelete ? regiaArchiveRows : archiveRows;
  const intro = canDelete ? '<div class="card"><h2>Gestione archivio</h2><p class="small muted">Da questa scheda puoi consultare ed eliminare le gare archiviate. L’eliminazione è definitiva e richiede conferma.</p></div>' : '';
  if (!rows.length) return intro + '<div class="empty"><h3>Nessuna partita archiviata</h3><p>Le partite concluse compariranno qui dopo l’archiviazione dalla regia.</p></div>';
  const typeLabels = { foul:'Fallo', kickoff:'Calcio d’inizio', halftime:'Fine primo tempo', secondhalf:'Inizio secondo tempo', fulltime:'Fine partita', goal:'Gol', yellow:'Ammonizione', red:'Espulsione', sub:'Sostituzione', save:'Parata', miss:'Occasione', shot:'Tiro', crossbar:'Traversa', corner:'Calcio d’angolo', freekick:'Calcio di punizione', offside:'Fuorigioco', injury:'Infortunio', note:'Aggiornamento', mvp:'Migliore in campo' };
  return intro + rows.map(row => {
    const state = row.state || {}, events = Array.isArray(state.events) ? state.events : [];
    // La regia consulta lo snapshot completo; il pubblico solo quanto è stato pubblicato.
    const match = state.match || {}, published = state.publication?.published || {};
    const rosters = (canDelete ? state.rosters : published.rosters) || {};
    const date = row.match_date && /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(row.match_date) ? row.match_date.split('-').reverse().join('/') : (row.match_date || 'Data non indicata');
    const eventHtml = events.map(ev => {
      const label = ev.type === 'foul' ? (ev.kind === 'rigore' && ev.foulInArea !== false ? 'Fallo da rigore' : ev.handball ? 'Fallo di mano' : 'Fallo') : (typeLabels[ev.type] || 'Evento');
      const side = ev.team === 'home' ? row.home_team : ev.team === 'away' ? row.away_team : '';
      const own = ev.type === 'goal' && ev.kind === 'autogol' ? ' · autogol' : '';
      const person = ev.player ? ' · ' + esc(ev.player) : '';
      const detail = ev.type === 'foul' ? (ev.kind === 'rigore' && ev.foulInArea !== false ? 'Calcio di rigore assegnato' : ev.handball ? 'Fallo di mano' : 'Fallo') : ev.type === 'sub' ? [ev.out, ev.inn].filter(Boolean).map(esc).join(' → ') : (ev.note ? esc(ev.note) : '');
      return `<div class="ev"><div class="m">${esc(ev.min || '–')}${ev.min ? '′' : ''}</div><div><div class="t"><b>${esc(label)}${own}</b>${person}</div><div class="small muted">${esc(side)}${detail ? ' · ' + detail : ''}</div></div></div>`;
    }).join('');
    const lineupHtml = ['home','away'].map(side => {
      const text = typeof rosters[side] === 'string' ? rosters[side].trim() : '';
      return text ? `<h4>${esc(side === 'home' ? row.home_team : row.away_team)}</h4><pre style="white-space:pre-wrap;font:inherit;font-size:13px">${esc(text)}</pre>` : '';
    }).join('');
    return `<article class="card"><div class="small muted">${esc(date)} · ${esc(row.competition || 'Partita')}${row.venue ? ' · ' + esc(row.venue) : ''}</div><div class="stat-h" style="grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);margin:12px 0"><span style="text-align:left">${esc(row.home_team)}</span><b style="white-space:nowrap">${Number(row.home_score)} – ${Number(row.away_score)}</b><span style="text-align:right">${esc(row.away_team)}</span></div><details><summary>Dettagli, cronaca e formazioni</summary><h4>Cronaca</h4>${eventHtml || '<p class="small muted">Nessun evento registrato.</p>'}${lineupHtml ? '<h4>Formazioni</h4>' + lineupHtml : ''}</details>${canDelete ? `<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn sm danger" data-a="deleteArchivedMatch" data-id="${esc(row.id)}">Elimina gara dall’archivio</button></div>` : ''}</article>`;
  }).join('') + (canDelete && regiaArchiveTotal > REGIA_ARCHIVE_PAGE_SIZE ? `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><button class="btn sm" data-a="archivePrev" ${regiaArchivePage <= 0 ? 'disabled' : ''}>Precedente</button><span class="small muted">Pagina ${regiaArchivePage + 1} di ${Math.ceil(regiaArchiveTotal / REGIA_ARCHIVE_PAGE_SIZE)} · ${regiaArchiveTotal} partite</span><button class="btn sm" data-a="archiveNext" ${((regiaArchivePage + 1) * REGIA_ARCHIVE_PAGE_SIZE >= regiaArchiveTotal) ? 'disabled' : ''}>Successiva</button></div>` : (canDelete && regiaArchiveTotal ? `<p class="small muted" style="text-align:center">${regiaArchiveTotal} partite archiviate</p>` : ''));
}

async function deleteArchivedMatch(id) {
  if (TEST_MODE) { toast('L’archivio ufficiale non è disponibile nella simulazione.'); return; }
   if (!CAN_EDIT || L.mode !== 'regia') { toast('Accedi alla regia per eliminare una gara'); return; }
  if (!db || !id) { toast('Partita non identificata'); return; }
  const row = (L.mode === 'regia' ? regiaArchiveRows : archiveRows).find(item => String(item.id) === String(id));
  if (!row) { toast('La gara non è più presente nell’archivio. Aggiorno l’elenco.'); await loadRegiaArchivePage(regiaArchivePage); return; }
  const date = row.match_date && /^\d{4}-\d{2}-\d{2}$/.test(row.match_date) ? row.match_date.split('-').reverse().join('/') : (row.match_date || 'data non indicata');
  const description = `${date}: ${row.home_team || 'Casa'} ${Number(row.home_score || 0)}–${Number(row.away_score || 0)} ${row.away_team || 'Ospiti'}`;
  if (!confirm(`Vuoi eliminare definitivamente questa gara dall’archivio?\n\n${description}\n\nL’operazione non è reversibile. Le altre gare resteranno invariate.`)) return;
  if (String(prompt('Seconda conferma: per eliminare definitivamente scrivi ELIMINA') || '').trim() !== 'ELIMINA') { toast('Eliminazione annullata: la gara è stata conservata'); return; }
  try {
    const { data, error } = await db.from('match_archive').delete().eq('id', id).select('id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('Eliminazione non autorizzata o gara già rimossa.');
    if (row.poll_id === S.match?.pollId) currentArchived = false;
    if (String(L.archiveFormationId || '') === String(id)) L.archiveFormationId = '';
    saveL();
    if (L.mode === 'regia') await loadRegiaArchivePage(regiaArchivePage);
    else await loadMatchArchive(true);
    toast('Gara eliminata dall’archivio');
    renderMain();
  } catch (error) {
    console.error('Eliminazione gara archiviata:', error);
    toast(error?.message || 'Eliminazione non riuscita');
  }
}

      '<h4>Titolari <span class="muted">· ' + starters.length + '</span></h4>' + (starters.length ? playerRows(starters) : '<p class="small muted">Nessun titolare indicato.</p>') +
      (bench.length ? '<h4>Panchina · ' + bench.length + '</h4>' + playerRows(bench) : '') + '</section>';
  }).join('');
  const date = selectedRow.match_date && /^\d{4}-\d{2}-\d{2}$/.test(selectedRow.match_date) ? selectedRow.match_date.split('-').reverse().join('/') : (selectedRow.match_date || 'Data non indicata');
  return '<div class="card"><h2>Archivio formazioni</h2><p class="small muted">Consultazione delle distinte conservate negli snapshot delle partite archiviate. I dati storici non sono modificabili da questa scheda.</p><div style="display:flex;flex-wrap:wrap;gap:7px;margin:12px 0">' + seasonButtons + '</div></div>' +
    '<div class="card"><h3>Partite · ' + esc(seasonLabel(selectedSeason)) + '</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px">' + matchButtons + '</div></div>' +
    '<div class="card"><div class="small muted">' + esc(date) + ' · ' + esc(selectedRow.competition || 'Partita') + (selectedRow.venue ? ' · ' + esc(selectedRow.venue) : '') + '</div><div class="stat-h" style="grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);margin:12px 0"><span style="text-align:left">' + esc(selectedRow.home_team || 'Casa') + '</span><b style="white-space:nowrap">' + Number(selectedRow.home_score || 0) + ' – ' + Number(selectedRow.away_score || 0) + '</b><span style="text-align:right">' + esc(selectedRow.away_team || 'Ospiti') + '</span></div>' +
    (hasLineups ? lineupCards : '<div class="empty"><h3>Formazioni non disponibili</h3><p>Per questa partita non sono state pubblicate le formazioni.</p></div>') + '</div>';
}

async function refreshCurrentArchiveStatus() {
  if (TEST_MODE || !db || !S.match?.pollId) { currentArchived = false; return false; }
  const matchId = currentMatchId();
  const { data, error } = await db.from('match_archive').select('id').eq('poll_id', matchId).maybeSingle();
  if (matchId !== currentMatchId()) return currentArchived;
  if (error) { currentArchived = false; console.warn('Verifica archiviazione partita:', error.message); return false; }
  currentArchived = !!data;
  return currentArchived;
}

async function archiveCurrentMatch() {
  if (TEST_MODE) { toast('L’archivio ufficiale è disattivato durante la simulazione.'); return; }
   if (!db || !CAN_EDIT) { toast('Accedi alla regia per archiviare la partita'); return; }
  if (S.clock.phase !== 'ft') { toast('L’archiviazione è disponibile solo dopo il fischio finale'); return; }
  if (syncState !== 'ok') { toast('Attendi la conferma “Pagina live aggiornata” prima di archiviare'); return; }
  if (!S.match.pollId) { toast('Identificativo partita mancante: salva la partita e riprova'); return; }
  try {
    const matchId = currentMatchId();
    const { data, error } = await db.rpc('archive_santalbino_match');
    if (error) throw error;
    if (matchId === currentMatchId()) currentArchived = true;
    if (L.mode === 'regia' && L.rtab === 'archive') await loadRegiaArchivePage(0);
    else if (L.mode !== 'regia' && ['archive','season','scorers','archiveForms'].includes(L.tab)) await loadMatchArchive(true);
    toast(data ? 'Partita archiviata e conservata nello storico' : 'Partita già presente nello storico');
    renderMain();
  } catch (error) {
    console.error('Archiviazione partita:', error);

  const preferred = activeSponsorGraphicUrl;
  const remaining = list.filter(url => url !== preferred);
  for (let i = remaining.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remaining[i], remaining[j]] = [remaining[j], remaining[i]];

  for (const url of [preferred, ...remaining]) {

}

function wrapCanvasText(ctx, text, maxWidth, maxLines, lineHeight) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = []; let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width <= maxWidth || !line) line = test;
    else { lines.push(line); line = word; }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    const clipped = lines.slice(0, maxLines);
    let last = clipped[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
    clipped[maxLines - 1] = last.replace(/[\s.,;:]+$/, '') + '…';
    return clipped;
  }
  return lines;
}

  let size = fontSize, lines;

    lines = wrapCanvasText(ctx, text, maxWidth, maxLines, lineHeight || size * 1.28);
    if (lines.length <= maxLines && lines.every(line => ctx.measureText(line).width <= maxWidth)) break;
    size -= 2;

function loadGraphicImage(src) {
  return new Promise(resolve => {
    if (!src) return resolve(null);
    const img = new Image(); let done = false;
    const finish = value => { if (done) return; done = true; clearTimeout(timer); img.onload = null; img.onerror = null; resolve(value); };
    const timer = setTimeout(() => finish(null), 9000);
    if (/^https?:/i.test(src)) img.crossOrigin = 'anonymous';
    img.onload = () => finish(img); img.onerror = () => finish(null); img.src = src;
  });
}

function resizeImage(file, max, type = 'image/jpeg', q = .82) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => res({ blob: b, url: c.toDataURL(type, q) }), type, q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Immagine non leggibile')); }; img.src = u;
  });
}

function resizeSponsorImage(file) {
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=2400,k=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
      const w=Math.max(1,Math.round((img.naturalWidth||img.width)*k)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*k));
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      canvas.toBlob(blob=>blob?resolve({blob,url:canvas.toDataURL('image/png')}):reject(new Error('Elaborazione logo sponsor non riuscita')),'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Logo sponsor non leggibile: carica un PNG, SVG o WebP di buona qualità.'));};
    img.src=url;
  });
}

// Normalizza ogni logo in un riquadro PNG trasparente 512×512.
// Il marchio viene sempre contenuto per intero, con margine di sicurezza.
function resizeLogo(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const size = 512, inner = 424;
      const scale = Math.min(inner / img.width, inner / img.height);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const x = c.getContext('2d');
      x.clearRect(0, 0, size, size);
      x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      URL.revokeObjectURL(u);
      c.toBlob(blob => blob ? res({ blob, url: c.toDataURL('image/png') }) : rej(new Error('Ridimensionamento logo non riuscito')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Logo non leggibile: usa PNG, JPG o WebP.')); };
    img.src = u;
  });
}

/* ================= migliore in campo ================= */
const VOTE_MS = 12 * 3600 * 1000;
function voteInfo() {
  const ft = [...S.events].reverse().find(e => e.type === 'fulltime');
  if (!ft && S.clock?.phase !== 'ft') return { state: 'none' };
  // Timestamp persistente: il countdown non riparte a ogni aggiornamento
  // se lo stato FT arriva senza l'evento fulltime.
  const lastEventTs = [...(S.events || [])].reverse().find(e => Number.isFinite(Number(e.ts)))?.ts;
  const fallbackEnd = Number(S.clock?.finishedAt) ||
    (Number(S.clock?.t0) > 0 ? Number(S.clock.t0) + 45 * 60 * 1000 : 0) ||
    Number(lastEventTs) || Date.now();
  const end = (Number(ft?.ts) || fallbackEnd) + VOTE_MS;
  const mv = S.events.find(e => e.type === 'mvp');
  const chosen = candidates();
  if (chosen.length !== 4 || new Set(chosen.map(c => c.side)).size !== 2) return { state: 'unconfigured', end, mv };
  return { state: mv ? 'done' : (Date.now() < end ? 'open' : 'closed'), end, mv };
}
function leftText(ms) { const m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`; }
function allMvpCandidates() {
  const out = [], published = publicContent();
  ['home', 'away'].forEach(side => parseRoster(published.rosters[side]).forEach(p => out.push({ side, num: p.num, name: p.name, key: side + '|' + p.name })));
  return out;
}
function candidates() {
  const saved = Array.isArray(S.mvp.candidatePlayers) ? S.mvp.candidatePlayers : [];
  if (saved.length === 4 && new Set(saved.map(p => p.key)).size === 4 &&
      saved.every(p => p && ['home', 'away'].includes(p.side) && p.name && p.key === p.side + '|' + p.name) &&
      new Set(saved.map(p => p.side)).size === 2) return saved;
  const all = allMvpCandidates();
  const keys = Array.isArray(S.mvp.candidateKeys) ? S.mvp.candidateKeys : [];
  if (keys.length !== 4 || new Set(keys).size !== 4) return [];
  return keys.map(key => all.find(candidate => candidate.key === key)).filter(Boolean);
}

/* ================= cronaca narrativa automatica ================= */
function buildChronicleDraft() {
  const events = S.events.map((event, index) => ({ event, index })).filter(({event}) => event.type !== 'mvp');
  if (!events.length) return '';
  const paragraphs = [];
  const scoreLabel = score => teamName('home') + ' ' + score[0] + '-' + score[1] + ' ' + teamName('away');
  const minuteLabel = e => e.min ? e.min + '′ – ' : '';
  for (const {event:e,index} of events) {
    const score = scoreAt(index), team = teamName(e.team);
    let sentence = '';
    switch (e.type) {
      case 'kickoff': paragraphs.push('PRIMO TEMPO'); sentence = 'L’arbitro fischia l’inizio della partita. Le due squadre sono in campo e la gara prende il via.'; break;
      case 'halftime': paragraphs.push('INTERVALLO'); sentence = 'Si chiude il primo tempo. Il risultato parziale è ' + scoreLabel(score) + '.'; break;
      case 'secondhalf': paragraphs.push('SECONDO TEMPO'); sentence = 'Le squadre tornano in campo: inizia la ripresa.'; break;
      case 'fulltime': paragraphs.push('FINALE'); sentence = 'Arriva il triplice fischio: la partita termina ' + scoreLabel(score) + '.'; break;
      case 'goal': sentence = e.kind === 'autogol'
        ? 'Autogol: ' + (e.player || 'un giocatore') + ' (' + team + ') devia il pallone nella propria porta. Il risultato è ' + scoreLabel(score) + '.'
        : 'GOL ' + team.toUpperCase() + '! ' + (e.player || 'Un giocatore') + ' trova la rete' + (e.kind === 'rigore' ? ' dal dischetto' : e.kind === 'punizione' ? ' su calcio di punizione' : e.kind === 'testa' ? ' con un colpo di testa' : '') + (e.assist ? ', su assist di ' + e.assist : '') + '. ' + scoreLabel(score) + '.';
        break;
      case 'shot': sentence = e.kind === 'fuori' ? (e.player || team) + ' prova la conclusione, ma il tiro termina fuori.' : e.kind === 'in_porta' ? (e.player || team) + ' calcia verso la porta: conclusione nello specchio.' : (e.player || team) + ' tenta la conclusione per ' + team + '.'; break;
      case 'save': sentence = 'Intervento del portiere ' + (e.player ? e.player + ' (' + team + ')' : 'di ' + team) + ': ' + (e.kind === 'facile' ? 'parata senza particolari difficoltà' : 'una parata importante') + '.'; break;
      case 'miss': sentence = 'Occasione per ' + team + (e.player ? ' con ' + e.player : '') + ': ' + String(e.kind || 'azione pericolosa').toLowerCase() + '.'; break;
      case 'crossbar': sentence = 'La conclusione di ' + (e.player || team) + ' si stampa sulla traversa!'; break;
      case 'corner': sentence = 'Calcio d’angolo per ' + team + (e.cornerSide ? ' dalla ' + e.cornerSide : '') + '.'; break;
      case 'freekick': sentence = 'Calcio di punizione per ' + team + (e.player ? ', battuto da ' + e.player : '') + (e.freeKickZone ? ' (' + freeKickZoneLabel(e.freeKickZone) + ')' : '') + '.'; break;
      case 'foul': sentence = e.kind === 'rigore' && e.foulInArea !== false ? 'Calcio di rigore assegnato a ' + team + ' per un fallo in area.' : 'L’arbitro fischia un fallo a favore di ' + team + (e.player ? ': ' + e.player + ' è coinvolto nell’azione' : '') + '.'; break;
      case 'yellow': sentence = 'Cartellino giallo per ' + (e.player || 'un giocatore') + ' (' + team + ').'; break;
      case 'red': sentence = 'Espulsione per ' + (e.player || 'un giocatore') + ' (' + team + ')' + (e.kind === 'doppio' ? ' per doppia ammonizione' : '') + ': la squadra prosegue in inferiorità numerica.'; break;
      case 'sub': sentence = 'Cambio per ' + team + ': entra ' + (e.inn || 'un giocatore') + ' ed esce ' + (e.out || 'un compagno') + '.' + (e.possibleSubs ? ' Tra le altre possibili sostituzioni: ' + e.possibleSubs + '.' : ''); break;
      case 'offside': sentence = 'Segnalato fuorigioco a ' + team + (e.player ? ' per ' + e.player : '') + '.'; break;
      case 'injury': sentence = 'Gioco interrotto per un infortunio a ' + (e.player || 'un giocatore') + ' (' + team + ').'; break;
      case 'note': sentence = String(e.note || '').trim(); break;
    }
    if (sentence) paragraphs.push(minuteLabel(e) + sentence);
  }
  return paragraphs.join('\n\n');
}

/* ================= resoconto automatico di fine partita ================= */
function buildMatchReport() {
  const [h, a] = scoreOf(S.events), date = fmtDate(S.match.date), title = `${teamName('home')} ${h}-${a} ${teamName('away')}`;
  const meta = [S.match.comp, date, S.match.venue].filter(Boolean).join(' · ');
  const goals = S.events.filter(e => e.type === 'goal').map(e => {
    const side = scoringSide(e), name = e.player || 'un giocatore';
    const method = e.kind === 'autogol' ? ' (autogol)' : e.kind === 'rigore' ? ' (su rigore)' : e.kind === 'punizione' ? ' (su punizione)' : e.kind === 'testa' ? ' (di testa)' : '';
    return `${e.min ? e.min + '′ ' : ''}${name} (${teamName(side)})${method}`;
  });
  const opening = `Si chiude sul risultato di ${h}-${a} la partita tra ${teamName('home')} e ${teamName('away')}${meta ? ', valida per ' + meta : ''}.`;
  const paragraphs = [opening];
  if (goals.length) paragraphs.push(`Le reti: ${goals.join('; ')}.`);
  else paragraphs.push('La gara si conclude senza reti.');
  const details = S.events
    .filter(e => !['goal','kickoff','halftime','secondhalf','fulltime','mvp'].includes(e.type))
    .map(e => buildText(e, scoreAt(S.events.indexOf(e))).replace(/\n/g, ' '));
  if (details.length) paragraphs.push(`Nel corso dell'incontro: ${details.join(' ')}`);
  const mvp = S.events.find(e => e.type === 'mvp');
  if (mvp) paragraphs.push(`Il pubblico ha scelto ${mvp.player} (${teamName(mvp.team)}) come migliore in campo${mvp.votes ? ', con ' + mvp.votes + ' voti' : ''}.`);

  // Inserisce nel resoconto le rose effettivamente registrate nella regia.
  const lineupSections = ['home', 'away'].map(side => {
    const players = parseRoster(S.rosters[side]);
    if (!players.length) return `FORMAZIONE ${teamName(side).toUpperCase()}\nFormazione non inserita.`;
    const starters = players.filter(p => p.starter);
    const bench = players.filter(p => !p.starter);
    const format = p => (p.num ? p.num + ' ' : '') + p.name;
    return [
      `FORMAZIONE ${teamName(side).toUpperCase()}`,
      starters.length ? `Titolari: ${starters.map(format).join(', ')}.` : '',
      bench.length ? `Panchina: ${bench.map(format).join(', ')}.` : ''
    ].filter(Boolean).join('\n');
  });
  const lineups = `FORMAZIONI\n\n${lineupSections.join('\n\n')}`;
  return `RESOCONTO FINALE\n${title}\n${meta}\n\n${paragraphs.join('\n\n')}\n\n${lineups}\n\n${S.match.hashtag || ''}`.trim();
}
function buildMatchSummary() {
  const score = scoreOf(S.events), home = teamName('home'), away = teamName('away');
  const goals = S.events.filter(e => e.type === 'goal').slice().sort((x,y) => {
    const minute = e => { const m = String(e.min || '').match(/^(\d+)(?:\s*\+\s*(\d+))?/); return m ? Number(m[1]) + Number(m[2] || 0) / 100 : 999; };
    return minute(x) - minute(y);
  });
  const scorers = goals.length ? goals.map(e => {
    const scorer = e.player || 'Autore del gol';
    const minute = e.min ? ' (' + e.min + '′)' : '';
    const own = e.kind === 'autogol' ? ' (autogol)' : '';
    return scorer + ' – ' + teamName(scoringSide(e)) + minute + own;
  }) : [];
  const result = home + ' ' + score[0] + '-' + score[1] + ' ' + away;
  const scorerLine = scorers.length ? 'Marcatori: ' + scorers.join('; ') + '.' : 'Marcatori: nessuno.';
  return result + '\n' + scorerLine;
}
async function renderMatchResultGraphic() {
  const [h, a] = scoreOf(S.events), W = 1600, H = 1200, canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const x = canvas.getContext('2d'); applyGraphicTypography(x, 'matchday', W, H);
  const [homeLogo, awayLogo] = await Promise.all([loadGraphicImage(S.logos.home), loadGraphicImage(S.logos.away)]);
  const bg = x.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#17633d'); bg.addColorStop(.52, '#0b3424'); bg.addColorStop(1, '#071d16');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(255,255,255,.09)'; x.lineWidth = 2;
  for (let i=0;i<9;i++){ x.beginPath(); x.moveTo(i*W/8,0); x.lineTo(i*W/8,H); x.stroke(); }
  x.fillStyle = 'rgba(2,13,9,.78)'; x.fillRect(0,0,W,360);
  const drawTeam = (img,name,cx) => {
    x.fillStyle='#fff'; rrect(x,cx-92,30,184,184,24); x.fill();
    if(img){ const k=Math.min(164/img.width,164/img.height),w=img.width*k,hh=img.height*k; x.drawImage(img,cx-w/2,40+(164-hh)/2,w,hh); }
    else { x.fillStyle='#17633d'; x.font='900 46px Arial'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(name.split(/\s+/).map(v=>v[0]).join('').slice(0,3).toUpperCase(),cx,122); }
    x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; fitFont(x,name.toUpperCase(),490,31,900,'Arial,sans-serif'); x.fillText(name.toUpperCase(),cx,258);
  };
  drawTeam(homeLogo,teamName('home'),330); drawTeam(awayLogo,teamName('away'),1270);
  x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#d7f1df'; x.font='900 34px Arial,sans-serif'; x.fillText('MATCH',800,82);
  x.fillStyle='#e3c66d'; x.font='900 112px Arial,sans-serif'; x.fillText(`${h}  –  ${a}`,800,205);
  x.fillStyle='#fff'; x.font='900 70px Arial,sans-serif'; x.fillText('MATCH RESULT',800,430);
  const meta=[S.match.comp,fmtDate(S.match.date),S.match.venue].filter(Boolean).join('  ·  ');
  if(meta){ x.fillStyle='rgba(255,255,255,.72)'; x.font='700 21px Arial,sans-serif'; fitFont(x,meta,1400,21,700,'Arial,sans-serif'); x.fillText(meta,800,480); }
  const goalMinute=e=>{const m=String(e.min||'').match(/^(\d+)(?:\s*\+\s*(\d+))?/);return m?Number(m[1])+Number(m[2]||0)/100:999;};
  const goalsBySide = {
    home: S.events.filter(e=>e.type==='goal' && scoringSide(e)==='home').slice().sort((a,b)=>goalMinute(a)-goalMinute(b)),
    away: S.events.filter(e=>e.type==='goal' && scoringSide(e)==='away').slice().sort((a,b)=>goalMinute(a)-goalMinute(b))
  };
  const panelY=535,panelH=565;
  x.fillStyle='rgba(3,15,8,.84)'; rrect(x,70,panelY,1460,panelH,26); x.fill();
  x.fillStyle='#e3c66d'; x.textAlign='center'; x.font='900 31px Arial,sans-serif'; x.fillText('MARCATORI',800,panelY+55);
  const maxRows=Math.max(goalsBySide.home.length,goalsBySide.away.length);
  if(!maxRows){
    x.fillStyle='rgba(255,255,255,.82)'; x.font='700 30px Arial,sans-serif'; x.fillText('NESSUNA RETE',800,panelY+280);
  } else {
    const rowH=Math.min(78,Math.max(36,440/maxRows));
    const colW=690, left=105, top=panelY+105;
    ['home','away'].forEach((side,col)=>{
      goalsBySide[side].forEach((g,row)=>{
        const xx=left+col*700,yy=top+row*rowH;
        x.fillStyle='rgba(255,255,255,.075)'; rrect(x,xx,yy,colW,rowH-8,12); x.fill();
        const scorer=(g.player||'Autore del gol')+(g.kind==='autogol'?' (aut.)':'');
        const detail=teamName(scoringSide(g))+'  ·  '+(g.min ? g.min+'′' : 'minuto n.d.');
        x.textAlign='left'; x.textBaseline='middle'; x.fillStyle='#fff';
        fitFont(x,scorer,colW-34,Math.min(25,rowH*.34),700,'Arial,sans-serif'); x.fillText(scorer,xx+18,yy+(rowH-8)*.38);
        x.fillStyle='#e3c66d'; fitFont(x,detail,colW-34,Math.min(19,rowH*.27),700,'Arial,sans-serif'); x.fillText(detail,xx+18,yy+(rowH-8)*.72);
      });
    });
  }
  x.textAlign='center'; x.fillStyle='rgba(255,255,255,.75)'; x.font='800 19px Arial,sans-serif';
  x.fillText('FORZA GIALLOVERDI  ·  ASD SANT’ALBINO TERME',800,1150);
  await addSponsorToGraphic(canvas,'matchday');
  return canvas;
}
async function openMatchResult() {
  const dlg=$('#graphicDlg');
  dlg.innerHTML='<div class="sheethead"><h2>MATCH RESULT</h2><button type="button" class="btn sm" data-a="graphicclose">Chiudi</button></div><p class="muted">Preparazione grafica e riepilogo…</p>';

  }

function validExternalUrl(value) {
  try { const u = new URL(String(value || '').trim()); return ['https:', 'http:'].includes(u.protocol) ? u.href : ''; } catch (e) { return ''; }
}

const TIMELINE_MARK = { goal: '⚽', yellow: '🟨', red: '🟥', sub: '🔄' };
function matchTimelineHtml() {
  const actions = S.events
    .filter(e => !PHASE_EV[e.type] && e.type !== 'mvp' && ['home', 'away'].includes(e.team) && e.min !== '' && e.min != null)
    .map(e => {
      const raw = String(e.min).trim();
      const parts = raw.match(/^(\d{1,3})(?:\s*\+\s*(\d{1,2}))?/);
      if (!parts) return null;
      const minute = Number(parts[1]) + Number(parts[2] || 0);
      if (!Number.isFinite(minute)) return null;
      return { e, minute, side: e.team === S.match.ourSide ? 'santa' : 'opponent' };
    })
    .filter(Boolean)
    .sort((a, b) => a.minute - b.minute);
  if (!actions.length) return '';
  const maxMinute = Math.max(90, ...actions.map(x => x.minute));
  const ticks = [0, 15, 30, 45, 60, 75, 90, ...(maxMinute > 90 ? [105, 120].filter(x => x < maxMinute || x === 120) : [])]
    .filter(x => x <= maxMinute);
  const stacks = new Map();
  const markers = actions.map(({ e, minute, side }) => {
    const key = side + ':' + minute;
    const stack = stacks.get(key) || 0;
    stacks.set(key, stack + 1);
    const position = Math.max(0, Math.min(100, minute / maxMinute * 100));
    return `<span class="match-tl-marker ${side}" style="--x:${position}%;--stack:${stack}" title="${esc(String(e.min))}′ · ${esc(describe(e, scoreAt(S.events.indexOf(e))).title)}"><i></i><b>${TIMELINE_MARK[e.type] || ''}${esc(String(e.min))}′</b></span>`;
  }).join('');
  const scale = ticks.map(minute => `<span class="match-tl-tick ${minute === 45 ? 'half' : ''}" style="--x:${minute / maxMinute * 100}%"><i></i><b>${minute}′</b></span>`).join('');
  return `<div class="match-timeline" role="img" aria-label="Timeline delle azioni: Sant'Albino sopra la linea, avversari sotto">
    <div class="match-tl-lane santa-label">S. Albino</div>
    <div class="match-tl-track"><div class="match-tl-axis"></div>${scale}${markers}</div>
    <div class="match-tl-lane opponent-label">Avversari</div>
  </div>`;
}

  else if (t === 'archive') body = archiveHtml();

function applyGraphicTypography(ctx,layout,width,height){

async function loadPdfFirstPage(file) {
  if (!window.pdfjsLib) {
    if (!window.__lineupPdfLoader) {
      window.__lineupPdfLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        script.onload = () => window.pdfjsLib ? resolve(window.pdfjsLib) : reject(new Error('Lettore PDF non disponibile.'));
        script.onerror = () => reject(new Error('Impossibile caricare il lettore PDF. Controlla la connessione.'));
        document.head.appendChild(script);
      }).catch(err => { window.__lineupPdfLoader = null; throw err; });
    }
    await window.__lineupPdfLoader;
  }
  const pdfjs = window.pdfjsLib;
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data }).promise;
  if (!pdf.numPages) throw new Error('Il PDF non contiene pagine leggibili.');
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: Math.min(2.2, 2800 / Math.max(page.view[2], page.view[3])) });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('Conversione della pagina PDF non riuscita.')), 'image/png'));
  return new File([blob], (file.name || 'distinta').replace(/\.pdf$/i, '') + '-pagina-1.png', { type: 'image/png' });
}
