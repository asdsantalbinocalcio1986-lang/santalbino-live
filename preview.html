<style>
:root{color-scheme:dark;--line:#314237;--muted:#a3b1a7;--green:#a6bd7c;--red:#e3342f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);font:15px/1.5 system-ui,-apple-system,sans-serif;color:#f2f6f1;background:radial-gradient(ellipse at 50% -10%,#285437 0,transparent 48%),linear-gradient(145deg,#080e0b,#101a13 60%,#080e0b)}main{max-width:680px;margin:0 auto;padding:22px 0 40px}.back{color:var(--green);text-decoration:none;font-weight:700}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px 0 8px;font-weight:900;font-size:22px;letter-spacing:.05em}.brand img{width:44px;height:44px;border-radius:11px;object-fit:contain}.comp{text-align:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}.date{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 20px}.scoreboard{border:1px solid var(--line);border-radius:22px;padding:24px 16px;background:linear-gradient(145deg,#19271e,#101912);text-align:center}.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}.team{min-width:0;font-weight:900;text-transform:uppercase;overflow-wrap:anywhere;font-size:15px}.team-name{min-height:4.05em;display:flex;align-items:flex-start;justify-content:center;line-height:1.35}.logo{display:block;width:clamp(68px,18vw,100px);height:clamp(68px,18vw,100px);object-fit:contain;margin:0 auto 10px}.score{font-size:clamp(38px,10vw,60px);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}.status{display:inline-block;margin-top:10px;padding:5px 13px;border-radius:99px;background:#35483a;font-size:13px;font-weight:900;letter-spacing:.07em}.status.live{background:var(--red);color:white;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.55}}.minute{margin-top:8px;color:var(--muted);font-weight:700}.section{margin:22px 0 10px;font-size:17px;text-transform:uppercase;letter-spacing:.07em}.panel{border:1px solid var(--line);border-radius:16px;padding:15px;background:#121d17}.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scorers h3{font-size:13px;color:var(--muted);margin:0 0 8px}.scorer{font-weight:700;margin:5px 0;overflow-wrap:anywhere}.last{color:var(--muted)}.cta{display:block;text-align:center;text-decoration:none;margin:22px 0 10px;padding:15px;border-radius:14px;background:var(--green);color:#10170c;font-weight:950;letter-spacing:.04em}.note{text-align:center;color:var(--muted);font-size:12px}.share-wrap{display:flex;justify-content:center;margin:14px 0}.share-btn{border:1px solid #536b56;border-radius:11px;padding:11px 16px;background:#203326;color:#eaf2e7;font:800 14px system-ui;cursor:pointer}.empty{text-align:center;padding:45px 12px;color:var(--muted)}a:focus-visible{outline:3px solid var(--green);outline-offset:3px}

.event-list{display:grid;gap:10px}.event-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#17231b}.event-minute{font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}.event-title{font-weight:850}.event-detail{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.detail-copy,.roster-copy{white-space:pre-wrap;overflow-wrap:anywhere}.roster-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.roster-grid h3{margin:0 0 8px;font-size:13px;color:var(--muted)}.archive-label{margin:14px auto 0;text-align:center;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.1em}.archive-tabs{display:flex;gap:4px;padding:4px;margin:18px 0 14px;border:1px solid var(--line);border-radius:14px;background:#1a281f;overflow-x:auto}.archive-tab{flex:1;min-width:max-content;border:0;border-radius:10px;padding:11px 13px;background:transparent;color:var(--muted);font:800 13px system-ui;cursor:pointer}.archive-tab[aria-selected=true]{background:#354b39;color:#fff}.archive-panel[hidden]{display:none!important}@media(max-width:440px){.roster-grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="./home.html">← SANTA Live</a><div class="brand"><img src="./santa-live-icon.svg?v=7" alt=""><span>SANTA Live</span></div><div id="content"><div class="empty">Caricamento partita…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script><script src="./config.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=new URLSearchParams(location.search).get('match'),cfg=window.SANTALBINO_CONFIG||{};let db=null,state=null,isCurrent=false;
const team=(s)=>state.match?.[s]||(s==='home'?'Casa':'Ospiti'),logo=s=>state.logos?.[s]||'',score=()=>{let h=0,a=0;(state.events||[]).forEach(e=>{if(e.type==='goal'){const side=e.kind==='autogol'?(e.team==='home'?'away':'home'):e.team;if(side==='home')h++;else if(side==='away')a++;}});return[h,a]};
const status=()=>({pre:'IN PROGRAMMA',p1:'PRIMO TEMPO',ht:'INTERVALLO',p2:'SECONDO TEMPO',ft:'FISCHIO FINALE'}[state.clock?.phase]||'PARTITA');
const minute=()=>{const c=state.clock||{};if(c.phase==='p1')return Math.max(1,Math.floor((Date.now()-(c.t0||Date.now()))/60000)+1);if(c.phase==='p2')return 45+Math.max(1,Math.floor((Date.now()-(c.t0||Date.now()))/60000)+1);if(c.phase==='ht')return [...(state.events||[])].reverse().find(e=>e.type==='halftime'&&e.min)?.min||'45';if(c.phase==='ft')return [...(state.events||[])].reverse().find(e=>e.type==='fulltime'&&e.min)?.min||'90';return null};
function render(){
 if(!state)return;
 const [h,a]=score(),live=['p1','p2'].includes(state.clock?.phase),date=/^\d{4}-\d{2}-\d{2}$/.test(state.match?.date||'')?state.match.date.split('-').reverse().join('/'):state.match?.date||'Data da definire';
 const side=s=>'<div class="team">'+(logo(s)?'<img class="logo" src="'+esc(logo(s))+'" alt="">':'<div class="logo"></div>')+'<div class="team-name">'+esc(team(s))+'</div></div>';
 const goals=s=>(state.events||[]).filter(e=>e.type==='goal'&&(e.kind==='autogol'?(e.team==='home'?'away':'home'):e.team)===s).map(e=>'<div class="scorer">'+esc(e.player||'Marcatore')+(e.kind==='autogol'?' (aut.)':e.kind==='rigore'?' (rig.)':'')+' · '+esc(e.min||'—')+'′</div>').join('')||'<div class="last">Nessuna rete</div>';
 const last=[...(state.events||[])].reverse().find(e=>!['kickoff','halftime','secondhalf','fulltime','mvp'].includes(e.type));
 const labels={kickoff:'Calcio d’inizio',halftime:'Fine primo tempo',secondhalf:'Inizio secondo tempo',fulltime:'Fischio finale',foul:'Fallo',goal:'Gol',yellow:'Ammonizione',red:'Espulsione',sub:'Sostituzione',save:'Parata',miss:'Occasione',shot:'Tiro',crossbar:'Traversa',corner:'Calcio d’angolo',freekick:'Calcio di punizione',offside:'Fuorigioco',injury:'Infortunio',note:'Aggiornamento'};
 const lastText=last?(last.min?last.min+'′ · ':'')+(labels[last.type]||'Evento')+(last.player?' · '+last.player:'')+(last.team?' · '+team(last.team):'')+(last.type==='foul'&&last.kind==='rigore'&&last.foulInArea!==false?' · RIGORE':last.type==='foul'&&last.handball?' · FALLO DI MANO':last.type==='foul'?' · FALLO':'')+(last.type==='freekick'&&last.freeKickZone?' · '+(({difensiva:'3/4 difensiva',offensiva:'3/4 offensiva','limite-centro':'Limite area centrale','limite-destra':'Limite area destra','limite-sinistra':'Limite area sinistra'})[last.freeKickZone]||''):'')+(last.type==='corner'&&last.cornerSide?' · da '+last.cornerSide:'')+(last.note?' · '+last.note:''):'Nessun evento registrato';
 const published=state.publication?.published;
 const publicData=published&&typeof published==='object'?published:{rosters:{},convocati:''};
 const publishedConvocati=String(publicData.convocati||'').trim();
 const publishedRosters=publicData.rosters&&typeof publicData.rosters==='object'?publicData.rosters:{};
 const events=Array.isArray(state.events)?state.events:[];
 const eventHtml=events.filter(e=>e&&e.type!=='mvp').map(e=>{
   const label=labels[e.type]||'Evento';
   const sideName=e.team==='home'?team('home'):e.team==='away'?team('away'):'';
   const person=e.player?' · '+esc(e.player):'';
   const own=e.type==='goal'&&e.kind==='autogol'?' · autogol':'';
   const penalty=e.type==='goal'&&e.kind==='rigore'?' · rigore':'';
   let detail='';
   if(e.type==='foul')detail=e.kind==='rigore'&&e.foulInArea!==false?'Calcio di rigore assegnato':e.handball?'Fallo di mano':'Fallo';
   else if(e.type==='sub')detail=[e.out,e.inn].filter(Boolean).map(esc).join(' → ');
   else if(e.type==='freekick')detail=({difensiva:'3/4 difensiva',offensiva:'3/4 offensiva','limite-centro':'Limite area centrale','limite-destra':'Limite area destra','limite-sinistra':'Limite area sinistra'})[e.freeKickZone]||'';
   else if(e.type==='corner'&&e.cornerSide)detail='da '+esc(e.cornerSide);
   if(e.note)detail+=(detail?' · ':'')+esc(e.note);
   return '<article class="event-row"><div class="event-minute">'+esc(e.min||'–')+(e.min?'′':'')+'</div><div><div class="event-title">'+esc(label+own+penalty)+person+'</div><div class="event-detail">'+esc(sideName)+(detail?(sideName?' · ':'')+detail:'')+'</div></div></article>';
 }).join('');
 const chronicle=String(state.match?.chroniclePublished||'').trim();
 const rosterHtml=['home','away'].map(s=>{
   const value=typeof publishedRosters[s]==='string'?publishedRosters[s].trim():'';
   return value?'<section class="panel"><h3>'+esc(team(s))+'</h3><div class="roster-copy">'+esc(value)+'</div></section>':'';
 }).join('');
  const schedule='<section class="scoreboard"><div class="teams">'+side('home')+'<div><div class="score">'+h+' – '+a+'</div><div class="status '+(live?'live':'')+'">'+(live?'● LIVE':status())+'</div>'+(minute()!==null?'<div class="minute">'+minute()+'′</div>':'')+'</div>'+side('away')+'</div></section><h2 class="section">Marcatori</h2><section class="panel scorers"><div><h3>'+esc(team('home'))+'</h3>'+goals('home')+'</div><div><h3>'+esc(team('away'))+'</h3>'+goals('away')+'</div></section><h2 class="section">Ultimo aggiornamento</h2><section class="panel">'+esc(lastText)+'</section>';
  const chroniclePanel=(chronicle?'<h2 class="section">Cronaca pubblicata</h2><section class="panel"><div class="detail-copy">'+esc(chronicle)+'</div></section>':'')+'<h2 class="section">Cronaca</h2><section class="panel event-list">'+(eventHtml||'<div class="last">Nessun evento registrato.</div>')+'</section>';
  const formations=rosterHtml?'<div class="roster-grid">'+rosterHtml+'</div>':'<section class="panel"><div class="last">Formazioni non pubblicate per questa partita.</div></section>';
  const convocati=publishedConvocati?'<section class="panel"><div class="detail-copy">'+esc(publishedConvocati)+'</div></section>':'<section class="panel"><div class="last">Convocati non pubblicati per questa partita.</div></section>';
  $('#content').innerHTML='<div class="comp">'+esc(state.match?.comp||'Partita')+'</div><div class="date">'+esc(date)+(state.match?.time?' · Ore '+esc(state.match.time):'')+(state.match?.venue?' · '+esc(state.match.venue):'')+'</div><div class="share-wrap" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="share-btn" type="button" data-share-action="facebook">↗ FACEBOOK</button><button class="share-btn" type="button" data-share-action="whatsapp">↗ WHATSAPP</button><button class="share-btn" style="grid-column:1/-1" type="button" data-share-action="copy">COPIA TESTO DEL POST</button></div><nav class="archive-tabs" aria-label="Sezioni partita"><button class="archive-tab" type="button" data-archive-tab="schedule" aria-selected="true">SCHEDULE</button><button class="archive-tab" type="button" data-archive-tab="chronicle" aria-selected="false">CRONACA</button><button class="archive-tab" type="button" data-archive-tab="formations" aria-selected="false">FORMAZIONI</button><button class="archive-tab" type="button" data-archive-tab="convocati" aria-selected="false">CONVOCATI</button></nav><section class="archive-panel" data-archive-panel="schedule">'+schedule+'</section><section class="archive-panel" data-archive-panel="chronicle" hidden>'+chroniclePanel+'</section><section class="archive-panel" data-archive-panel="formations" hidden>'+formations+'</section><section class="archive-panel" data-archive-panel="convocati" hidden>'+convocati+'</section>'+(isCurrent?'<a class="cta" href="./index.html?view=live">ENTRA NELLA DIRETTA COMPLETA →</a>':'<div class="archive-label">PARTITA ARCHIVIATA · SOLA CONSULTAZIONE</div>')+'<div class="note">Dati storici in sola lettura: nessuna modifica viene applicata alla partita archiviata.</div>';
}
function trackSessionVisit(){let seen=false;try{seen=sessionStorage.getItem('santa-live-visit-counted-v1')==='1';if(!seen)sessionStorage.setItem('santa-live-visit-counted-v1','1')}catch(e){}if(seen)return;void db.rpc('track_santalbino_analytics',{p_event_type:'visit',p_page:'match'}).then(({error})=>{if(error){console.warn('Conteggio visite SANTA Live:',error.message);try{sessionStorage.removeItem('santa-live-visit-counted-v1')}catch(e){}}})}
async function load(){if(!id){$('#content').innerHTML='<div class="empty">Collegamento partita non valido.</div>';return}if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){$('#content').innerHTML='<div class="empty">Servizio temporaneamente non disponibile.</div>';return}db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);trackSessionVisit();try{const {data:live,error}=await db.from('live_state').select('state').eq('id',1).maybeSingle();if(error)throw error;if(live?.state?.match?.pollId===id){state=live.state;isCurrent=true}else{const {data,error:archError}=await db.from('match_archive').select('state').eq('poll_id',id).maybeSingle();if(archError)throw archError;if(!data?.state)throw new Error('Partita non trovata');state=data.state;isCurrent=false}render();if(isCurrent){db.channel('santa-preview-'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_state',filter:'id=eq.1'},p=>{if(p.new?.state?.match?.pollId===id){state=p.new.state;render()}}).subscribe();setInterval(render,15000)}}catch(e){console.error('Anteprima partita:',e);$('#content').innerHTML='<div class="empty">Partita non trovata o non disponibile. <p><a class="back" href="./home.html">Torna alla Home SANTA Live</a></p></div>'}}
function matchShareText(){const [h,a]=score();return ['⚽ SANTA Live · '+team('home')+' '+h+'-'+a+' '+team('away'),status(),state.match?.comp||'',state.match?.venue||'','#SANTALive'].filter(Boolean).join('\n')}
function matchShareUrl(){return new URL('./preview.html?match='+encodeURIComponent(id),location.href).href}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-archive-tab]');if(!tab)return;const key=tab.dataset.archiveTab;document.querySelectorAll('[data-archive-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===tab)));document.querySelectorAll('[data-archive-panel]').forEach(p=>p.hidden=p.dataset.archivePanel!==key)});
document.addEventListener('click',async e=>{const button=e.target.closest('[data-share-action]');if(!button)return;e.preventDefault();const action=button.dataset.shareAction,link=matchShareUrl(),caption=matchShareText();if(action==='copy'){try{await navigator.clipboard.writeText(caption);alert('Testo del post copiato.')}catch(err){window.prompt('Copia il testo del post:',caption)}return}if(action==='whatsapp'){const waUrl='https://wa.me/?text='+encodeURIComponent(caption+'\n\nSegui la partita su SANTA Live: '+link);location.href=waUrl;return}if(action==='facebook'){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link),'_blank','noopener');try{await navigator.clipboard.writeText(caption);alert('Testo copiato: incollalo nella descrizione del post Facebook.')}catch(err){window.prompt('Copia il testo del post Facebook:',caption)}}});
void load();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e)));
})();
