<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SANTA Live | Anteprima partita</title><meta name="theme-color" content="#102819"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./santa-live-icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SANTA Live"><link rel="apple-touch-icon" href="./santa-live-icon.svg">
<style>
:root{color-scheme:dark;--line:#314237;--muted:#a3b1a7;--green:#a6bd7c;--red:#e3342f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);font:15px/1.5 system-ui,-apple-system,sans-serif;color:#f2f6f1;background:radial-gradient(ellipse at 50% -10%,#285437 0,transparent 48%),linear-gradient(145deg,#080e0b,#101a13 60%,#080e0b)}main{max-width:680px;margin:0 auto;padding:22px 0 40px}.back{color:var(--green);text-decoration:none;font-weight:700}.brand{text-align:center;margin:24px 0 8px;font-weight:900;font-size:22px;letter-spacing:.05em}.comp{text-align:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}.date{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 20px}.scoreboard{border:1px solid var(--line);border-radius:22px;padding:24px 16px;background:linear-gradient(145deg,#19271e,#101912);text-align:center}.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}.team{min-width:0;font-weight:900;text-transform:uppercase;overflow-wrap:anywhere;font-size:15px}.logo{display:block;width:clamp(68px,18vw,100px);height:clamp(68px,18vw,100px);object-fit:contain;margin:0 auto 10px}.score{font-size:clamp(38px,10vw,60px);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}.status{display:inline-block;margin-top:10px;padding:5px 13px;border-radius:99px;background:#35483a;font-size:13px;font-weight:900;letter-spacing:.07em}.status.live{background:var(--red);color:white;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.55}}.minute{margin-top:8px;color:var(--muted);font-weight:700}.section{margin:22px 0 10px;font-size:17px;text-transform:uppercase;letter-spacing:.07em}.panel{border:1px solid var(--line);border-radius:16px;padding:15px;background:#121d17}.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scorers h3{font-size:13px;color:var(--muted);margin:0 0 8px}.scorer{font-weight:700;margin:5px 0;overflow-wrap:anywhere}.last{color:var(--muted)}.cta{display:block;text-align:center;text-decoration:none;margin:22px 0 10px;padding:15px;border-radius:14px;background:var(--green);color:#10170c;font-weight:950;letter-spacing:.04em}.note{text-align:center;color:var(--muted);font-size:12px}.empty{text-align:center;padding:45px 12px;color:var(--muted)}a:focus-visible{outline:3px solid var(--green);outline-offset:3px}
</style></head><body><main><a class="back" href="./home.html">← SANTA Live</a><div class="brand">ANTEPRIMA PARTITA</div><div id="content"><div class="empty">Caricamento partita…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=new URLSearchParams(location.search).get('match'),cfg=window.SANTALBINO_CONFIG||{};let db=null,state=null,isCurrent=false;
const team=(s)=>state.match?.[s]||(s==='home'?'Casa':'Ospiti'),logo=s=>state.logos?.[s]||'',score=()=>{let h=0,a=0;(state.events||[]).forEach(e=>{if(e.type==='goal'){const side=e.kind==='autogol'?(e.team==='home'?'away':'home'):e.team;if(side==='home')h++;else if(side==='away')a++;}});return[h,a]};
const status=()=>({pre:'IN PROGRAMMA',p1:'PRIMO TEMPO',ht:'INTERVALLO',p2:'SECONDO TEMPO',ft:'FISCHIO FINALE'}[state.clock?.phase]||'PARTITA');
const minute=()=>{const c=state.clock||{};if(c.phase==='p1')return Math.max(1,Math.floor((Date.now()-(c.t0||Date.now()))/60000)+1);if(c.phase==='p2')return 45+Math.max(1,Math.floor((Date.now()-(c.t0||Date.now()))/60000)+1);if(c.phase==='ht')return [...(state.events||[])].reverse().find(e=>e.type==='halftime'&&e.min)?.min||'45';if(c.phase==='ft')return [...(state.events||[])].reverse().find(e=>e.type==='fulltime'&&e.min)?.min||'90';return null};
function render(){if(!state)return;const [h,a]=score(),live=['p1','p2'].includes(state.clock?.phase),date=/^\d{4}-\d{2}-\d{2}$/.test(state.match?.date||'')?state.match.date.split('-').reverse().join('/'):state.match?.date||'Data da definire';const side=s=>'<div class="team">'+(logo(s)?'<img class="logo" src="'+esc(logo(s))+'" alt="">':'<div class="logo"></div>')+esc(team(s))+'</div>';
const goals=(s)=>(state.events||[]).filter(e=>e.type==='goal'&&(e.kind==='autogol'?(e.team==='home'?'away':'home'):e.team)===s).map(e=>'<div class="scorer">'+esc(e.player||'Marcatore')+(e.kind==='autogol'?' (aut.)':e.kind==='rigore'?' (rig.)':'')+' · '+esc(e.min||'—')+'′</div>').join('')||'<div class="last">Nessuna rete</div>';
const last=[...(state.events||[])].reverse().find(e=>!['kickoff','halftime','secondhalf','fulltime','mvp'].includes(e.type));
const labels={goal:'Gol',yellow:'Ammonizione',red:'Espulsione',sub:'Sostituzione',save:'Parata',miss:'Occasione',shot:'Tiro',crossbar:'Traversa',corner:'Calcio d’angolo',freekick:'Calcio di punizione',offside:'Fuorigioco',injury:'Infortunio',note:'Aggiornamento'};
const lastText=last?(last.min?last.min+'′ · ':'')+(labels[last.type]||'Evento')+(last.player?' · '+last.player:'')+(last.team?' · '+team(last.team):'')+(last.note?' · '+last.note:''):'Nessun evento registrato';
$('#content').innerHTML='<div class="comp">'+esc(state.match?.comp||'Partita')+'</div><div class="date">'+esc(date)+(state.match?.venue?' · '+esc(state.match.venue):'')+'</div><section class="scoreboard"><div class="teams">'+side('home')+'<div><div class="score">'+h+' – '+a+'</div><div class="status '+(live?'live':'')+'">'+(live?'● LIVE':status())+'</div>'+(minute()!==null?'<div class="minute">'+minute()+'′</div>':'')+'</div>'+side('away')+'</div></section><h2 class="section">Marcatori</h2><section class="panel scorers"><div><h3>'+esc(team('home'))+'</h3>'+goals('home')+'</div><div><h3>'+esc(team('away'))+'</h3>'+goals('away')+'</div></section><h2 class="section">Ultimo aggiornamento</h2><section class="panel">'+esc(lastText)+'</section>'+(isCurrent?'<a class="cta" href="./index.html?view=live">ENTRA NELLA DIRETTA COMPLETA →</a>':'<div class="cta" style="opacity:.65">PARTITA ARCHIVIATA</div>')+'<div class="note">Risultato e cronaca derivano dai dati registrati in SANTA Live.</div>';
}
async function load(){if(!id){$('#content').innerHTML='<div class="empty">Collegamento partita non valido.</div>';return}if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){$('#content').innerHTML='<div class="empty">Servizio temporaneamente non disponibile.</div>';return}db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);try{const {data:live,error}=await db.from('live_state').select('state').eq('id',1).maybeSingle();if(error)throw error;if(live?.state?.match?.pollId===id){state=live.state;isCurrent=true}else{const {data,error:archError}=await db.from('match_archive').select('state').eq('poll_id',id).maybeSingle();if(archError)throw archError;if(!data?.state)throw new Error('Partita non trovata');state=data.state;isCurrent=false}render();if(isCurrent){db.channel('santa-preview-'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_state',filter:'id=eq.1'},p=>{if(p.new?.state?.match?.pollId===id){state=p.new.state;render()}}).subscribe();setInterval(render,15000)}}catch(e){console.error('Anteprima partita:',e);$('#content').innerHTML='<div class="empty">Partita non trovata o non disponibile. <p><a class="back" href="./home.html">Torna alla Home SANTA Live</a></p></div>'}}
void load();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e)));
})();
</script></body></html>
