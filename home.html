<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SANTA Live | Partite</title><meta name="description" content="Partite, risultati e dirette dell'ASD Sant'Albino Terme.">
<meta name="theme-color" content="#102819"><meta property="og:type" content="website"><meta property="og:site_name" content="SANTA Live"><meta property="og:title" content="SANTA Live | Partite e dirette"><meta property="og:description" content="Segui risultati, formazioni e cronaca delle partite dell’ASD Sant’Albino Terme."><meta property="og:image" content="https://asdsantalbinocalcio1986-lang.github.io/santalbino-live/assets/icon-512.png"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="SANTA Live | Partite e dirette"><meta name="twitter:description" content="Segui risultati, formazioni e cronaca delle partite dell’ASD Sant’Albino Terme."><meta name="twitter:image" content="https://asdsantalbinocalcio1986-lang.github.io/santalbino-live/assets/icon-512.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./santa-live-icon.svg?v=5" type="image/svg+xml"><link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SANTA Live"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#080e0b;--panel:#121d17;--line:#314237;--text:#f2f6f1;--muted:#a3b1a7;--green:#9db978;--red:#e3342f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);font:15px/1.5 system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -10%,#285437 0,transparent 48%),linear-gradient(145deg,#080e0b,#101a13 60%,#080e0b)}main{max-width:720px;margin:0 auto;padding:22px 0 40px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:25px;font-weight:900;letter-spacing:.04em}.brand b{color:#a6bd7c}.sub{color:var(--muted);font-size:13px}.section{margin:26px 0 12px;font-size:19px;text-transform:uppercase;letter-spacing:.06em}.card{display:block;color:inherit;text-decoration:none;background:linear-gradient(145deg,#19271e,#101912);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;transition:border-color .15s}.card:active{border-color:var(--green)}.card.featured{padding:20px;border:1px solid #8da96c;background:radial-gradient(ellipse at 50% 0%,#365b36 0,transparent 65%),linear-gradient(145deg,#1b3021,#101912);box-shadow:0 12px 36px #0005}.featured-tag{display:inline-flex;padding:5px 10px;border-radius:99px;background:#a6bd7c;color:#10170c;font-size:11px;font-weight:950;letter-spacing:.1em;margin-bottom:12px}.meta{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.match-info{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0 2px}.info-chip{border:1px solid #405546;border-radius:9px;padding:6px 9px;color:#dbe5d9;font-size:12px}.featured .team{font-size:15px}.featured .logo{width:68px;height:68px}.vs{font-size:20px;font-weight:900;color:var(--green);letter-spacing:.05em}.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:14px 0}.team{text-align:center;min-width:0;font-weight:800;text-transform:uppercase;font-size:14px;overflow-wrap:anywhere}.logo{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 8px}.score{font-size:31px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}.status{display:inline-flex;padding:4px 10px;border-radius:99px;background:#344438;color:#e8f1e9;font-size:12px;font-weight:800;letter-spacing:.06em}.status.live{background:var(--red);color:white;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.55}}.go{margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--green);color:#11190d;font-weight:900;text-align:center}.empty{padding:20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}.foot{text-align:center;color:var(--muted);font-size:12px;padding:28px 0 12px}button{font:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:3px}
</style>
</head>
<body><main>
<header class="head"><div><div class="brand"><b>SANTA</b> Live</div><div class="sub">ASD Sant'Albino Terme · Partite e dirette</div></div><span class="status">LIVE CENTER</span></header>
<section><h1 class="section">La partita della settimana</h1><div id="current"><div class="empty">Caricamento della partita…</div></div></section>
<section><h2 class="section">Partite archiviate</h2><div id="archive"><div class="empty">Caricamento dello storico…</div></div></section>
<footer class="foot">© 2026 ASD Sant'Albino Terme · SANTA Live<br><a href="./index.html" style="color:inherit">Accesso alla piattaforma</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1"></script><script src="./config.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.SANTALBINO_CONFIG||{};const PAGE_SIZE=10;let db=null,current=null,currentArchived=false,rows=[],archiveOffset=0,archiveHasMore=true,archiveBusy=false;
const fmtDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'):v||'Data da definire';
const score=state=>{let h=0,a=0;for(const e of state?.events||[])if(e.type==='goal'){const side=e.kind==='autogol'?(e.team==='home'?'away':'home'):e.team;if(side==='home')h++;else if(side==='away')a++;}return [h,a]};
const phase=state=>({pre:'IN PROGRAMMA',p1:'PRIMO TEMPO',ht:'INTERVALLO',p2:'SECONDO TEMPO',ft:'FINALE'}[state?.clock?.phase]||'PARTITA');
const isLive=state=>['p1','p2'].includes(state?.clock?.phase);
const team=(m,s)=>m?.[s]|| (s==='home'?'Casa':'Ospiti');
const logo=(state,s)=>state?.logos?.[s]||'';
function card(state,id,archived=false,featured=false){const m=state.match||{},[h,a]=score(state),live=isLive(state),pre=state.clock?.phase==='pre',url='./preview.html?match='+encodeURIComponent(id);
const side=(s)=>'<div class="team">'+(logo(state,s)?'<img class="logo" src="'+esc(logo(state,s))+'" alt="">':'<div class="logo" aria-hidden="true"></div>')+esc(team(m,s))+'</div>';
const info=[m.comp||'Competizione da definire',m.date?fmtDate(m.date):'Data da definire',m.time?'Ore '+m.time:'Orario da definire',m.venue||'Campo da definire'].map(v=>'<span class="info-chip">'+esc(v)+'</span>').join('');
return '<a class="card '+(featured?'featured':'')+'" href="'+url+'">'+(featured?'<div class="featured-tag">★ PARTITA DELLA SETTIMANA</div>':'')+'<div class="meta">'+(featured?'IN EVIDENZA · ':'')+esc(m.comp||'Partita')+'</div><div class="teams">'+side('home')+'<div style="text-align:center"><div class="'+(pre?'vs':'score')+'">'+(pre?'VS':h+' – '+a)+'</div><span class="status '+(live?'live':'')+'">'+(live?'● '+phase(state):archived?'ARCHIVIATA':phase(state))+'</span></div>'+side('away')+'</div>'+(featured?'<div class="match-info">'+info+'</div>':'')+'<div class="go">'+(featured?'VEDI ANTEPRIMA DELLA PARTITA →':'APRI ANTEPRIMA →')+'</div></a>'}
function renderArchive(){const old=rows.filter(r=>r.poll_id);const cards=old.map(r=>card(r.state||{match:{home:r.home_team,away:r.away_team,comp:r.competition,date:r.match_date,venue:r.venue},events:[],clock:{phase:'ft'}},r.poll_id,true)).join('');$('#archive').innerHTML=(cards||'<div class="empty">Le partite concluse e archiviate compariranno qui.</div>')+(archiveHasMore?'<button id="loadMoreArchive" type="button" '+(archiveBusy?'disabled':'')+' style="display:block;width:100%;margin:14px 0;padding:13px;border:1px solid #405546;border-radius:12px;background:#19271e;color:#f2f6f1;font-weight:800;cursor:pointer">'+(archiveBusy?'CARICAMENTO…':'CARICA ALTRE PARTITE')+'</button>':'');}
function render(){const currentId=current?.match?.pollId;if(currentId && current.match.away && (current.clock?.phase!=='ft'||!currentArchived)){$('#current').innerHTML=card(current,currentId,false,true)}else{$('#current').innerHTML='<div class="empty">Al momento non ci sono partite in programma o in diretta. Consulta lo storico qui sotto.</div>'}renderArchive()}
async function loadArchive(reset=false){if(!db||archiveBusy||(!reset&&!archiveHasMore))return;archiveBusy=true;if(reset){rows=[];archiveOffset=0;archiveHasMore=true;renderArchive()}else renderArchive();try{const start=reset?0:archiveOffset;const {data,error}=await db.from('match_archive').select('poll_id,match_date,competition,venue,home_team,away_team,state,archived_at').order('match_date',{ascending:false}).order('archived_at',{ascending:false}).range(start,start+PAGE_SIZE-1);if(error)throw error;const page=data||[];rows=reset?page:[...rows,...page];archiveOffset=rows.length;archiveHasMore=page.length===PAGE_SIZE;renderArchive()}catch(e){console.error('SANTA Live archivio:',e);if(!rows.length)$('#archive').innerHTML='<div class="empty">Storico temporaneamente non disponibile. Riprova tra poco.</div>'}finally{archiveBusy=false;renderArchive()}}
async function refresh(){if(!db)return;try{const {data,error}=await db.from('live_state').select('state').eq('id',1).maybeSingle();if(error)throw error;current=data?.state||null;const currentId=current?.match?.pollId;currentArchived=false;if(currentId&&current.clock?.phase==='ft'){const archived=await db.from('match_archive').select('poll_id').eq('poll_id',currentId).maybeSingle();if(archived.error)throw archived.error;currentArchived=!!archived.data}render()}catch(e){console.error('SANTA Live home:',e);if(!current)$('#current').innerHTML='<div class="empty">Connessione temporaneamente non disponibile. Riprova tra poco.</div>';}}
if(cfg.supabaseUrl&&cfg.supabaseAnonKey&&window.supabase){db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);void refresh();void loadArchive(true);$('#archive').addEventListener('click',e=>{if(e.target.closest('#loadMoreArchive'))void loadArchive()});db.channel('santa-home-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_state',filter:'id=eq.1'},p=>{if(p.new?.state){current=p.new.state;render()}}).subscribe();setInterval(refresh,30000)}else{$('#current').innerHTML='<div class="empty">Servizio temporaneamente non disponibile.</div>'}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e)));
})();
</script></body></html>
