name: Validate and deploy Sant'Albino Live

on:
  push:
    branches: [main, fix/social-publisher-hardening-2026-11-25, feat/social-editorial-worker-final-2026-11-25]
  pull_request:
    branches: [main, integration/social-postmatch-2026-11-25, feat/social-editorial-worker-final-2026-11-25]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep pull-request validation separate from production Pages deployment.
  # A PR check must never cancel an in-progress deployment on main.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deployment' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application and security migration
        run: node scripts/validate-project.mjs
      - name: Verify social copy editor guards
        run: node tests/social-copy/ui-guards.mjs
      - name: Setup Deno for editorial worker tests
        if: ${{ hashFiles('supabase/functions/santalive-editorial-worker/index_test.ts') != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test editorial worker with mocked Meta transport
        if: ${{ hashFiles('supabase/functions/santalive-editorial-worker/index_test.ts') != '' }}
        run: deno test supabase/functions/santalive-editorial-worker/index_test.ts
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test social publisher with mocked Meta transport
        run: deno test --allow-env supabase/functions/santalive-social-publish/index_test.ts

  postmatch-sql-tests:
    name: Post-match SQL integration tests (ephemeral PostgreSQL)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/social-publisher-hardening-2026-11-25'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare disposable PostgreSQL fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postmatch/setup.sql
      - name: Apply post-match SQL proposal
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/proposals/postmatch_editorial_revisions.sql
      - name: Apply social publication schema and claim hardening
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123160000_santalbino_social_publications.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261125120000_santalbino_social_publisher_claims.sql
      - name: Verify social publisher claims, permissions and uncertainty states
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/social-publisher/claims.sql
          DB_URL="$DATABASE_URL" node tests/social-publisher/claim-concurrency.mjs
      - name: Verify revision lifecycle, authorization and immutability
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postmatch/assertions.sql
      - name: Verify editorial approval and sharing UI guards
        run: node tests/postmatch/ui-guards.mjs

  postmatch-local-supabase-tests:
    name: Post-match integration tests (isolated local Supabase)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/social-publisher-hardening-2026-11-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Initialize disposable local Supabase project
        run: supabase init
      - name: Keep hosted migration chain out of disposable local boot
        run: |
          mv supabase/migrations /tmp/santalbino-hosted-migrations
          mkdir -p supabase/migrations
      - name: Start local Supabase services
        run: supabase start --exclude studio,edge-runtime,logflare,vector,postgres-meta,mailpit,supavisor,imgproxy
      - name: Export local-only Supabase credentials
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase-local.env
          grep -E '^(API_URL|DB_URL|ANON_KEY|SERVICE_ROLE_KEY)=' /tmp/supabase-local.env \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Verify Auth, RLS, Storage and post-match revision lifecycle
        run: node tests/postmatch/supabase-local.mjs
      - name: Install Playwright browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify post-match editor in the control-room browser
        run: node tests/postmatch/browser-e2e.mjs
      - name: Stop disposable local Supabase services
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
